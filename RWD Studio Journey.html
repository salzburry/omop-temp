/state fields in the demographics source.","coverage":"engine_family"},{"tumour":"prostate","name":"REGION1","sketch":"US region of the treating practice from the practice state (label + code column pair).","sources":"Structured practice/state fields in the demographics source.","coverage":"engine_family"},{"tumour":"mcrc","name":"REGION","sketch":"Geographic region of the treating practice, mapped from state to a census-style region; used for case-mix description and as an adjustment covariate.","sources":"Practice state in EHR-derived site metadata; registry geography in SEER.","coverage":"engine_family"}],"engine":{"config":"demographics.regions","verification":"component / component"}},{"name":"BMI_BSA","category":"comorbidity_labs","definition":"Baseline body-mass index (and body-surface area where stated) from the vitals nearest index — height/weight pairing windows, a NAMED formula method, and banded groups. The formula is a registry name the engine owns; the bands and windows are the tumour's parameters.","slots":{"pairing":{"description":"the height/weight selection windows and pairing rule","examples":{}},"methods":{"description":"bmi_method / bsa_method — named registry methods, never restated formulas","examples":{}},"bands":{"description":"the BMI band edges from the approved workbook","examples":{}}},"citations":["in-house: prostate 202606 programme specification / functional contract","in-house: oc 202606 programme specification (sanitized extraction)"],"uses":[{"tumour":"ovarian","name":"BMI_VITALS","sketch":"Baseline BMI (and bands) from vitals nearest index; height/weight and dates carried.","sources":"Vitals table (height/weight tests) nearest index.","coverage":"engine_family"},{"tumour":"prostate","name":"BMI_VITALS","sketch":"Baseline BMI/BSA and their bands from vitals nearest index (height/weight pairing, named formula methods, banded groups); height/weight/dates carried.","sources":"Vitals table (height/weight tests) nearest index.","coverage":"engine_family"},{"tumour":"mcrc","name":"BMI_BSA","sketch":"Height and weight nearest the index, paired into BMI and body surface area by a named formula. BSA is not only a covariate here: the fluoropyrimidine, oxaliplatin and irinotecan doses are body-surface-area based, so the formula choice is a dosing input as well","sources":"Structured vitals in EHR-derived data, taken from the observation closest to index within a stated window.","coverage":"engine_family"}],"engine":{"config":"clinical.vitals","verification":"component / component"}},{"name":"LAB_VALUES","category":"comorbidity_labs","definition":"The closest-to-index baseline laboratory panel — per analyte a presence flag, numeric value and result date (units-restricted), e.g. albumin, ALP, ALT, AST, bilirubin, creatinine, hemoglobin, lymphocytes, neutrophils, platelets.","slots":{"panel":{"description":"which analytes, their test-name matches and unit restrictions","examples":{}},"window":{"description":"the lookback/lookahead around index and the tie-break","examples":{}}},"citations":["in-house: prostate 202606 programme specification / functional contract","in-house: oc 202606 programme specification (sanitized extraction)"],"uses":[{"tumour":"ovarian","name":"LAB_PANEL","sketch":"Closest-to-index lab panel incl. CA-125 (LABCAN) beside ALB, ALP, ALT, AST, BIL, CRE, HEM, LYM, NEU, PLA — presence flag + value + date + units per analyte.","sources":"Laboratory results table, unit-restricted per analyte.","coverage":"engine_family"},{"tumour":"prostate","name":"LAB_PANEL","sketch":"Closest-to-index lab panel: ALB, ALP, ALT, AST, BIL, CRE, HEM, LYM, NEU, PLA — each a presence flag + value + date.","sources":"Laboratory results table, unit-restricted per analyte.","coverage":"engine_family"},{"tumour":"mcrc","name":"LAB_VALUES","sketch":"Baseline laboratory panel closest to index — haemoglobin, neutrophils, platelets, albumin, bilirubin, alkaline phosphatase, LDH, creatinine — windowed and unit-normalised. It supplies the standard prognostic covariates and the values against which fitness for ","sources":"Structured laboratory results in EHR-derived data, closest value within a stated window before index.","coverage":"config_expressible"}],"engine":{"config":"clinical.lab_values, clinical.labs","verification":"unit / stage"}},{"name":"CANCER_STAGE_GROUP","category":"staging_histology","definition":"Overall stage group at a stated point in the disease course, in a named staging system. The system differs by tumour (AJCC/TNM, FIGO, Ann Arbor, Binet/Rai, ISS/R-ISS) and the published collapse of categories differs by study, so both are parameters rather than part of the concept.","slots":{"system":{"description":"the staging system and edition (e.g. AJCC 8th, FIGO 2014, Ann Arbor, Binet, R-ISS)","examples":{}},"timing":{"description":"the point the stage is taken at (initial diagnosis, advanced/metastatic diagnosis, index) and the rule when several are recorded","examples":{}},"collapse":{"description":"how source categories are grouped for reporting (e.g. FIGO prefix cascade IV>III>II>I, or I-II vs III-IV) and the label for unknown/not documented","examples":{}}},"citations":["mCODE STU4 Cancer Stage Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-cancer-stage","mCODE STU4 TNM Stage Group Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-tnm-stage-group"],"uses":[{"tumour":"ovarian","name":"FIGOSTAGE","sketch":"FIGO 2014 stage (I-IV with substages) for ovary/fallopian tube/peritoneum; stage IIIC (nodal/peritoneal spread) and IV (distant/pleural) dominate advanced cohorts.","sources":"Abstracted staging from operative/pathology notes; registry stage in SEER-Medicare","coverage":"config_expressible"},{"tumour":"endometrial","name":"FIGOSTAGE","sketch":"FIGO stage at diagnosis; FIGO 2023 revision integrates histology, lymphovascular space invasion and molecular class (e.g., stage shifts for POLEmut and p53abn tumors), while many RWD cohorts still carry FIGO 2009 stage.","sources":"Abstracted staging from operative/pathology notes; registry stage in linked data","coverage":"config_expressible"},{"tumour":"nsclc","name":"STAGE_AT_INITIAL_DX","sketch":"AJCC/registry group stage at initial diagnosis (I-IV), used to characterize de-novo stage IV versus recurrent advanced disease and to benchmark against SEER/NPCR distributions.","sources":"Abstracted staging documentation in EHR-derived data; collaborative stage in registries.","coverage":"config_expressible"},{"tumour":"sclc","name":"VALG_STAGE","sketch":"Two-level Veterans Administration Lung Study Group classification — limited disease (confined to one hemithorax/regional nodes, encompassable in a radiation port) versus extensive disease (all else); the dominant staging variable in SCLC real-world studies.","sources":"Abstracted from staging notes/imaging reports; derived from TNM when only registry stage exists.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"ANN_ARBOR_STAGE","sketch":"Ann Arbor stage I-IV per Lugano-modernized staging (PET-CT based for FDG-avid lymphomas); IPI treats stage III/IV as a risk factor.","sources":"Abstracted staging documentation and imaging reports in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"cll","name":"RAI_STAGE","sketch":"Rai clinical stage 0-IV from lymphocytosis, lymphadenopathy, organomegaly, anemia (Hgb <11 g/dL) and thrombocytopenia (plt <100 x 10^9/L); US convention, often collapsed to low/intermediate/high risk.","sources":"Abstracted clinical assessments; derived from exam findings and CBC.","coverage":"config_expressible"},{"tumour":"cll","name":"BINET_STAGE","sketch":"Binet stage A/B/C from number of involved lymphoid areas plus anemia or thrombocytopenia; European convention, captured for cross-walk with Rai.","sources":"Abstracted clinical assessments.","coverage":"config_expressible"},{"tumour":"hnscc","name":"AJCC8_OVERALL_STAGE","sketch":"Overall stage group per AJCC 8th edition, which introduced a separate, down-staged classification for p16-positive oropharyngeal cancer derived from ICON-S; LA cohorts are typically stage III-IVB (7th edition III-IVB analogues before 2018).","sources":"Abstracted stage from clinician/pathology documentation in EHR-derived data; registry AJCC/derived stage fields in SEER-Medicare.","coverage":"config_expressible"},{"tumour":"hnscc","name":"STAGE_EDITION_HARMONIZATION","sketch":"Record of the AJCC edition used at diagnosis and any cross-edition mapping, required for cohorts spanning the 2017/2018 transition because 7th and 8th edition stage groups are not comparable for p16-positive oropharynx.","sources":"Derived variable combining diagnosis year, documented edition, and p16 status in EHR-derived and registry data.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"ISS_STAGE","sketch":"International Staging System stage I-III from serum beta2-microglobulin and albumin at diagnosis.","sources":"Derived from structured baseline labs or abstracted clinician staging in EHR-derived data; frequently incomplete when baseline labs are missing.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"R_ISS_STAGE","sketch":"Revised ISS combining ISS with high-risk chromosomal abnormalities by interphase FISH (del(17p), t(4;14), t(14;16)) and serum LDH.","sources":"Derived from labs plus abstracted FISH results; completeness limited by real-world FISH testing rates.","coverage":"engine_gap"},{"tumour":"multiple_myeloma","name":"R2_ISS_STAGE","sketch":"Second revision of the ISS: additive risk score over ISS stage, del(17p), t(4;14), LDH, and 1q21 gain/amplification, defining four prognostic groups (low to high).","sources":"Derived from labs and abstracted FISH including 1q21 copy number.","coverage":"engine_gap"},{"tumour":"mcrc","name":"STAGE_AT_INITIAL_DX","sketch":"AJCC stage recorded at the initial colorectal diagnosis. It separates patients metastatic at presentation from those who recur, and is the covariate that positions a patient at the entry point of the metastatic treatment algorithm.","sources":"Abstracted staging documents in EHR-derived data; registry stage fields.","coverage":"config_expressible"}],"engine":{"config":"clinical.staging","verification":"unit / stage"}},{"name":"TNM_CATEGORY","category":"staging_histology","definition":"An individual T, N or M category, reported separately from the overall stage group. Carried as its own concept because a study may use the components without the group, or use a component the group collapses away.","slots":{"component":{"description":"which category is carried (T, N, M) and whether clinical or pathological","examples":{}},"edition":{"description":"the AJCC edition the category is coded against","examples":{}}},"citations":["mCODE STU4 TNM Primary Tumor Category: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-tnm-primary-tumor-category","mCODE STU4 TNM Regional Nodes Category Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-tnm-regional-nodes-category"],"uses":[{"tumour":"prostate","name":"TNM_STAGE","sketch":"Clinical/pathologic TNM stage at initial diagnosis (with M1 substage a/b/c for metastatic site), abstracted or registry-derived.","sources":"Abstracted staging documentation; registry stage in SEER-Medicare","coverage":"config_expressible"},{"tumour":"sclc","name":"TNM_STAGE_8TH_EDITION","sketch":"AJCC/UICC 8th-edition TNM stage, recommended by IASLC for SCLC alongside VALG dichotomy; enables mapping between registry TNM and limited/extensive categories.","sources":"Registry-coded TNM (SEER); abstracted staging in EHR databases.","coverage":"config_expressible"},{"tumour":"hnscc","name":"TNM_CATEGORIES","sketch":"Clinical and pathological T, N, and M categories per AJCC 8th edition, including the incorporation of extranodal extension into N classification for non-HPV cancers and depth of invasion into oral cavity T category.","sources":"Abstracted staging documentation; registry TNM fields in SEER-Medicare.","coverage":"config_expressible"}],"engine":{"config":"clinical.categoricals","verification":"unit / declared only"}},{"name":"HISTOLOGIC_TYPE","category":"staging_histology","definition":"Morphology and behaviour of the tumour determined from examination of a sample — the histologic type and its subtype. The coding vocabulary (ICD-O-3 morphology, WHO classification, a vendor grouping) and the grouping a study reports differ, and both are parameters.","slots":{"vocabulary":{"description":"the source vocabulary (ICD-O-3 morphology, WHO, vendor category) the delivery codes against","examples":{}},"grouping":{"description":"how source types are grouped for reporting (e.g. serous vs non-serous, squamous vs non-squamous) and the label for unknown","examples":{}}},"citations":["mCODE STU4 Histologic Behavior and Type: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-histologic-behavior-and-type"],"uses":[{"tumour":"ovarian","name":"HISTOLOGY","sketch":"Epithelial histologic subtype (high-grade serous, low-grade serous, endometrioid, clear cell, mucinous, carcinosarcoma); high-grade serous is the modal subtype in advanced/platinum-treated cohorts.","sources":"Abstracted pathology reports","coverage":"config_expressible"},{"tumour":"endometrial","name":"HISTOLOGY","sketch":"Histologic subtype: endometrioid vs non-endometrioid (serous, clear cell, carcinosarcoma, mixed, undifferentiated/dedifferentiated); FIGO 2023 formalizes aggressive vs non-aggressive histotypes.","sources":"Abstracted pathology reports","coverage":"config_expressible"},{"tumour":"nsclc","name":"HISTOLOGY","sketch":"NSCLC histologic subtype classified as squamous, non-squamous (adenocarcinoma and other), or NSCLC NOS; determines biomarker-testing expectations and treatment pathways.","sources":"Abstracted pathology reports in EHR-derived databases; ICD-O histology codes in registries.","coverage":"config_expressible"},{"tumour":"sclc","name":"INITIAL_VS_PROGRESSED_ES","sketch":"Flag distinguishing de novo extensive-stage presentation from progression to ES after initial limited-stage disease; affects prior-therapy exposure and prognosis.","sources":"Longitudinal abstraction of staging and progression events in EHR.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"HISTOLOGY_WHO","sketch":"Confirmation of DLBCL (DLBCL NOS and related entities) per the WHO classification of lymphoid neoplasms, distinguishing DLBCL NOS from high-grade B-cell lymphoma categories introduced in the 2016 revision.","sources":"Abstracted hematopathology reports in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"COO","sketch":"Cell-of-origin subtype (GCB vs ABC/non-GCB, or unclassified) assigned by the Hans IHC algorithm (CD10, BCL6, MUM1) in routine practice or by gene expression profiling (e.g., Lymph2Cx on FFPE tissue) in research settings.","sources":"Abstracted immunohistochemistry results in EHR-derived pathology data; NanoString/GEP assays in research linkages.","coverage":"config_expressible"},{"tumour":"hnscc","name":"HISTOLOGY_SCC","sketch":"Confirmation of squamous cell carcinoma histology (ICD-O-3 morphology), an inclusion criterion for essentially all LA-HNSCC studies.","sources":"Abstracted pathology reports; registry histology codes in SEER-Medicare.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"MM_ISOTYPE","sketch":"Monoclonal protein heavy-chain and light-chain isotype (IgG/IgA/light-chain-only, kappa/lambda) from electrophoresis and immunofixation at diagnosis.","sources":"Structured or abstracted SPEP/immunofixation results in EHR-derived data.","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"MF_SUBTYPE","sketch":"Classification as primary MF versus post-PV MF versus post-ET MF using IWG-MRT criteria (prior PV/ET plus bone marrow fibrosis and defined clinical features); secondary MF is prognostically distinct (MYSEC-PM rather than DIPSS is preferred).","sources":"Clinician documentation and pathology reports abstracted in EHR-derived data; registry classification fields","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"ANTECEDENT_MPN_HISTORY","sketch":"History and date of antecedent PV or ET diagnosis, giving duration of chronic-phase MPN before fibrotic transformation; documented prospectively in the MOST registry ET-to-MF progression analyses.","sources":"Longitudinal EHR problem lists and oncology history; registry enrollment history","coverage":"config_expressible"},{"tumour":"mds","name":"WHO_ICC_SUBTYPE","sketch":"Morphologic/genetic subtype per WHO 5th edition (e.g., MDS with low blasts, MDS-SF3B1, MDS-biTP53, MDS-IB1/IB2) or ICC 2022 (including MDS/AML for 10-19% blasts); earlier cohorts use WHO 2016 categories.","sources":"Pathology reports plus molecular results (abstracted); registry central diagnosis","coverage":"config_expressible"},{"tumour":"mds","name":"RING_SIDEROBLASTS","sketch":"Ring sideroblast percentage on iron stain; >=15% (or >=5% with SF3B1 mutation) defined MDS-RS in WHO 2016, now subsumed into SF3B1-defined disease.","sources":"Bone marrow pathology reports with iron stain results","coverage":"config_expressible"},{"tumour":"mds","name":"THERAPY_RELATED_MDS","sketch":"MDS arising after prior cytotoxic chemotherapy or radiation (WHO: myeloid neoplasm post cytotoxic therapy; ICC qualifier \"therapy-related\"); a distinct, poorer-prognosis stratum in registries and claims cohorts.","sources":"Treatment history in EHR/claims; registry classification fields","coverage":"config_expressible"},{"tumour":"mcrc","name":"HISTOLOGY_SUBTYPE","sketch":"Conventional adenocarcinoma versus mucinous (extracellular mucin above the stated proportion) versus signet-ring cell. Both special subtypes present at more advanced stage, are enriched for peritoneal spread and carry shorter survival, and even a minor signet-","sources":"Pathology reports abstracted from EHR; ICD-O-3 morphology in registry data.","coverage":"config_expressible"}],"engine":{"config":"clinical.categoricals","verification":"unit / declared only"}},{"name":"HISTOLOGIC_GRADE","category":"staging_histology","definition":"Tumour grade determined from examination of a sample. The grading instrument is tumour-specific (Gleason, WHO grade, marrow fibrosis grade) and mCODE requires the method be stated with the value, which is why the instrument is a slot rather than assumed.","slots":{"system":{"description":"the grading instrument and its scale (e.g. Gleason score/grade group, WHO 1-3, MF-0 to MF-3)","examples":{}},"banding":{"description":"how grades are grouped for reporting and the label for ungraded/unknown","examples":{}}},"citations":["mCODE STU4 Histologic Grade: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-histologic-grade"],"uses":[{"tumour":"ovarian","name":"GRADE","sketch":"Tumor grade, in serous carcinoma dichotomized high-grade vs low-grade; drives eligibility for PARP inhibitor maintenance studies (high-grade serous/endometrioid).","sources":"Abstracted pathology reports","coverage":"config_expressible"},{"tumour":"endometrial","name":"GRADE","sketch":"Tumor grade for endometrioid carcinoma (G1-G3, commonly binarized low-grade G1-2 vs high-grade G3); non-endometrioid histologies are treated as high-grade by convention.","sources":"Abstracted pathology reports","coverage":"config_expressible"},{"tumour":"prostate","name":"GLEASON","sketch":"Gleason score at diagnosis and ISUP Grade Group (1-5; Grade Group 5 = Gleason 9-10); Gleason >=8 is a component of LATITUDE high-risk criteria.","sources":"Abstracted biopsy/prostatectomy pathology reports","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"BM_FIBROSIS_GRADE","sketch":"Reticulin/collagen fibrosis grade MF-0 to MF-3 by the European consensus system; grade >=2 is a MIPSS70 risk component and separates overt PMF from prefibrotic PMF in WHO 2016.","sources":"Bone marrow biopsy pathology reports (abstracted free text)","coverage":"config_expressible"}],"engine":{"config":"clinical.categoricals","verification":"unit / declared only"}},{"name":"PRIMARY_TUMOR_SITE","category":"staging_histology","definition":"The anatomic site of the primary neoplasm — the original or first tumour in the body. Distinct from metastatic sites, and distinct from the laterality/qualifier that may accompany it.","slots":{"vocabulary":{"description":"the site vocabulary (ICD-O-3 topography, SNOMED body structure, vendor field)","examples":{}},"grouping":{"description":"how sites are grouped for reporting, and whether laterality is carried","examples":{}}},"citations":["mCODE STU4 Primary Cancer Condition Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-primary-cancer-condition"],"uses":[{"tumour":"gist","name":"PRIMARY_TUMOR_SITE","sketch":"Anatomic origin (stomach, small intestine, rectum/colon, esophagus, extra-gastrointestinal); prognosis is site-dependent with gastric primaries more favorable at equal size/mitoses.","sources":"Pathology/operative reports; registry primary-site codes.","coverage":"config_expressible"},{"tumour":"hnscc","name":"PRIMARY_SITE","sketch":"Anatomic primary site (oropharynx, larynx, hypopharynx, oral cavity) mapped from ICD-O-3 topography; drives site-specific staging chapters and treatment paradigms such as larynx preservation.","sources":"Abstracted pathology/clinician documentation with ICD-O-3 topography in EHR-derived data; registry site codes in SEER-Medicare.","coverage":"config_expressible"},{"tumour":"mcrc","name":"PRIMARY_TUMOUR_SITE","sketch":"Anatomical site of the primary — colon versus rectum, and the finer topography (caecum through sigmoid, rectosigmoid, rectum) from which sidedness is derived. Rectal primaries carry a different local-therapy pathway and a different metastatic pattern.","sources":"ICD-O-3 topography and abstracted pathology site in EHR-derived data; registry site codes.","coverage":"config_expressible"},{"tumour":"mcrc","name":"TUMOUR_SIDEDNESS","sketch":"Right-sided (caecum to transverse colon) versus left-sided (splenic flexure to rectum), derived from the primary site rather than recorded directly. Prognostic overall and, in RAS wild-type disease, predictive of anti-EGFR benefit in a pooled analysis of six r","sources":"Derived from the primary tumour site column; abstracted operative and endoscopy reports where topography is not coded.","coverage":"config_expressible"}],"engine":{"config":"clinical.categoricals","verification":"unit / declared only"}},{"name":"METASTATIC_DISEASE","category":"staging_histology","definition":"Presence, sites and onset of secondary (metastatic) disease. Covers the site list, the count or volume where a study bands it, and the de-novo-versus-recurrent distinction, which is a different question from whether metastases exist.","slots":{"sites":{"description":"which anatomic sites are captured and how they are grouped (e.g. brain, liver, bone, visceral vs non-visceral)","examples":{}},"timing":{"description":"the window the site is assessed in relative to index, and the rule when several assessments exist","examples":{}},"onset_type":{"description":"how de novo metastatic disease is distinguished from metastasis after an earlier localised diagnosis, and the threshold used","examples":{}}},"citations":["mCODE STU4 Secondary Cancer Condition Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-secondary-cancer-condition","mCODE STU4 History of Metastatic Cancer: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-history-of-metastatic-cancer"],"uses":[{"tumour":"prostate","name":"DENOVO_MET","sketch":"De novo (synchronous) metastatic presentation vs metachronous progression from earlier-stage disease, defined by the interval between initial diagnosis and first metastasis (e.g., within 90 days = de novo).","sources":"Derived from DXDATE and METDATE","coverage":"config_expressible"},{"tumour":"prostate","name":"METVOLUME","sketch":"CHAARTED disease volume: high volume = visceral metastases and/or >=4 bone lesions with >=1 beyond the vertebral column/pelvis; low volume otherwise.","sources":"Abstracted imaging reports (bone scan/CT) at metastatic diagnosis","coverage":"config_expressible"},{"tumour":"prostate","name":"METSITES","sketch":"Sites of metastatic disease (bone-only, nodal, visceral: liver/lung), at metastatic diagnosis and at line index; visceral involvement is prognostic in the Halabi model.","sources":"Abstracted imaging/clinician documentation","coverage":"engine_family"},{"tumour":"sclc","name":"BRAIN_METASTASES_AT_INDEX","sketch":"Presence of CNS metastases at or before index (treated/untreated); an IMpower133 stratification factor and key effect modifier for PCI and IO analyses.","sources":"Imaging report abstraction; ICD secondary-malignancy codes in claims-linked data.","coverage":"engine_family"},{"tumour":"sclc","name":"SITES_OF_METASTASIS","sketch":"Enumerated distant metastatic sites at index (liver, bone, brain, adrenal), commonly reported as baseline prognostic covariates in ES-SCLC cohorts.","sources":"Abstracted imaging/clinical notes; registry collaborative-stage site fields.","coverage":"engine_family"},{"tumour":"gist","name":"METASTATIC_SITES","sketch":"Distant disease sites at index, dominated by liver and peritoneum in GIST natural-history series.","sources":"Imaging reports; abstracted clinical notes.","coverage":"config_expressible"},{"tumour":"mcrc","name":"METASTATIC_ONSET_TYPE","sketch":"Synchronous (metastatic at or within a short window of the initial diagnosis) versus metachronous (distant recurrence after earlier-stage disease). Population data report shorter survival for synchronous presentation, driven substantially by a lower proportion","sources":"Derived from the initial diagnosis and metastatic diagnosis dates, with the window stated in config; abstracted recurrence documentation.","coverage":"config_expressible"},{"tumour":"mcrc","name":"METASTATIC_SITES","sketch":"Sites of distant disease at index — liver, lung, peritoneum, distant nodes, bone, brain — carried as flags plus a site count. Peritoneal involvement is associated with materially shorter overall and progression-free survival in pooled first-line trial data, wh","sources":"Abstracted radiology and clinician documentation of metastatic sites in EHR-derived databases.","coverage":"engine_family"},{"tumour":"mcrc","name":"LIVER_LIMITED_DISEASE","sketch":"Distant disease confined to the liver at index. This is the presentation for which conversion — downsizing initially unresectable disease to resectable — is a stated treatment goal rather than palliation, and conversion series report long-term survival compara","sources":"Derived from the metastatic-site flags; abstracted resectability assessment where recorded.","coverage":"config_expressible"}],"engine":{"config":"clinical.metastatic_sites","verification":"unit / stage"}},{"name":"PROGNOSTIC_RISK_SCORE","category":"staging_histology","definition":"A named prognostic instrument reported as a score or a risk category — IPI and NCCN-IPI, IPSS-R and IPSS-M, DIPSS, MIPSS70, Miettinen/AFIP, modified NIH, cytogenetic and karyotype risk groups. One concept because the instrument, its inputs and its banding are exactly what differs; mCODE profiles two disease-specific risk assessments and has no general class, so this is a local concept by necessity.","slots":{"instrument":{"description":"the named risk instrument and its version","examples":{}},"inputs":{"description":"which component variables the score is computed from, or whether it arrives pre-computed from the delivery","examples":{}},"banding":{"description":"the risk categories reported and their cut-points, and the label for not evaluable","examples":{}}},"citations":["mCODE STU4 ALL Risk Assessment Profile (disease-specific; mCODE has no general prognostic-index class, so the general form here is local): http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-ALL-risk-assessment"],"uses":[{"tumour":"prostate","name":"RISK_LATITUDE","sketch":"LATITUDE high-risk mHSPC: >=2 of Gleason >=8, >=3 bone lesions, measurable visceral metastasis; alternative risk stratifier to CHAARTED volume.","sources":"Derived from Gleason and abstracted imaging variables","coverage":"config_expressible"},{"tumour":"dlbcl","name":"IPI","sketch":"International Prognostic Index score 0-5 from five factors (age over 60, LDH above normal, ECOG 2 or higher, stage III/IV, more than one extranodal site), grouped into low/low-intermediate/high-intermediate/high risk.","sources":"Derived from abstracted components in EHR-derived databases; sometimes directly documented in notes.","coverage":"engine_gap"},{"tumour":"dlbcl","name":"NCCN_IPI","sketch":"Enhanced IPI for the rituximab era with graded age and LDH-ratio categories plus specific extranodal involvement and ECOG; better discrimination of low- and high-risk groups than the classic IPI.","sources":"Derived from abstracted clinical and laboratory components in EHR-derived data.","coverage":"engine_gap"},{"tumour":"gist","name":"MIETTINEN_AFIP_RISK_GROUP","sketch":"AFIP/Miettinen risk-of-progression category (none through high) from the site-size-mitoses cross-tabulation; the dominant risk scheme in registry-based GIST literature.","sources":"Derived from size, mitotic rate, and site variables.","coverage":"config_expressible"},{"tumour":"gist","name":"MODIFIED_NIH_RISK_GROUP","sketch":"Modified NIH (Joensuu) risk classification adding tumor rupture and non-gastric site as high-risk qualifiers; the criterion commonly used to select adjuvant imatinib candidates.","sources":"Derived from size, mitoses, site, and rupture variables.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"HIGH_RISK_CYTOGENETIC_CLASS","sketch":"Composite high versus standard cytogenetic risk classification (any of del(17p), t(4;14), t(14;16), with 1q21+ variably included), used to stratify real-world treatment patterns and outcomes.","sources":"Derived from abstracted FISH results in EHR-derived data.","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"DIPSS_RISK_CATEGORY","sketch":"Dynamic risk score from age >65, Hb <10 g/dL, WBC >25 x10^9/L, blasts >=1%, constitutional symptoms, assignable at any time in the course; DIPSS-plus adds unfavorable karyotype, platelets <100 x10^9/L and RBC transfusion need.","sources":"Derived from abstracted labs/notes in EHR data; often documented directly in hematology notes; registry risk fields","coverage":"engine_gap"},{"tumour":"myelofibrosis","name":"MIPSS70_RISK_CATEGORY","sketch":"Mutation-enhanced score for transplant-age PMF combining clinical factors (Hb <10, WBC >25, platelets <100, blasts >=2%, fibrosis >=2, constitutional symptoms) with genetics (absence of CALR type 1/like; presence and number of HMR mutations); v2.0 adds U2AF1 Q","sources":"Derived variable requiring NGS panel plus labs; molecular pathology reports in EHR-derived data","coverage":"engine_gap"},{"tumour":"myelofibrosis","name":"KARYOTYPE_RISK","sketch":"Cytogenetic category — DIPSS-plus unfavorable karyotype (e.g., +8, -7/7q-, i(17q), -5/5q-, 12p-, inv(3), 11q23 rearrangement) or MIPSS70+ v2.0 favorable/unfavorable/very-high-risk karyotype.","sources":"Cytogenetics/karyotype reports from bone marrow evaluation (abstracted)","coverage":"config_expressible"},{"tumour":"mds","name":"CYTOGENETIC_RISK_GROUP","sketch":"Five-group cytogenetic classification (very good/good/intermediate/poor/very poor) from the international database merge, embedded in IPSS-R and carried into IPSS-M.","sources":"Karyotype/FISH reports from marrow evaluation (abstracted)","coverage":"config_expressible"},{"tumour":"mds","name":"IPSS_R_SCORE","sketch":"Revised IPSS score/category (very low to very high) from cytogenetic group, blast percentage and depth of cytopenias; the reference risk system for treatment selection and trial eligibility since 2012.","sources":"Derived from abstracted labs/pathology; often documented in hematology notes and registries","coverage":"engine_gap"},{"tumour":"mds","name":"IPSS_M_SCORE","sketch":"Molecular IPSS combining hemoglobin, platelets, blasts and cytogenetics with mutations in 31 genes (including TP53 multihit, MLL/KMT2A-PTD, FLT3, SF3B1); reclassifies about 46% of patients relative to IPSS-R and is validated in real-world cohorts.","sources":"Derived variable requiring NGS panel plus labs; molecular reports in EHR-linked genomic data","coverage":"engine_gap"},{"tumour":"mds","name":"HIGHER_RISK_FLAG","sketch":"Dichotomization into lower-risk versus higher-risk MDS (commonly IPSS-R >3.5 or intermediate-and-above, or corresponding IPSS-M bands); determines HMA-based versus supportive/erythroid-directed pathways and applies the IWG 2023 HR-MDS response framework.","sources":"Derived from risk-score fields; treatment-intent documentation","coverage":"config_expressible"}],"engine":{"config":"clinical.categoricals","verification":"unit / declared only"}},{"name":"TUMOR_BURDEN_FEATURE","category":"staging_histology","definition":"A stated feature of disease extent or aggressiveness that is not the stage group: bulky disease, extranodal involvement and its extension, blast percentage in marrow or peripheral blood, mitotic rate, myometrial invasion, lymphovascular space invasion. One concept whose FEATURE and THRESHOLD are parameters, because each is a boolean or a band over a source measurement.","slots":{"feature":{"description":"which burden feature is carried","examples":{}},"threshold":{"description":"the cut-point that makes it positive (e.g. bulky >=7.5cm, blast >=20%) and the label for unknown","examples":{}},"timing":{"description":"the assessment window relative to index","examples":{}}},"citations":["mCODE STU4 Tumor Size Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-tumor-size","mCODE STU4 Tumor Profile (mCODE carries size and identity; the threshold-bearing burden features here are local): http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-tumor"],"uses":[{"tumour":"ovarian","name":"SURGTYPE","sketch":"Primary treatment surgical pathway: primary debulking surgery vs neoadjuvant chemotherapy with interval debulking; a core stratifier of first-line ovarian cohorts.","sources":"Abstracted operative notes + chemotherapy sequence relative to surgery date","coverage":"engine_family"},{"tumour":"ovarian","name":"RESIDDZ","sketch":"Residual disease after cytoreductive surgery (complete resection R0 vs <=1 cm vs >1 cm); consensus-recognized prognostic factor and required stratification variable in first-line trials.","sources":"Abstracted operative/surgical notes","coverage":"config_expressible"},{"tumour":"endometrial","name":"MYOINV","sketch":"Depth of myometrial invasion (<50% vs >=50%), a component of FIGO staging and ESGO risk grouping.","sources":"Abstracted surgical pathology reports","coverage":"config_expressible"},{"tumour":"endometrial","name":"LVSI","sketch":"Lymphovascular space invasion, per ESGO/FIGO conventions reported as none/focal/substantial; substantial LVSI upstages disease in FIGO 2023.","sources":"Abstracted surgical pathology reports","coverage":"config_expressible"},{"tumour":"dlbcl","name":"EXTRANODAL_SITES","sketch":"Number of extranodal disease sites; more than one site is an IPI risk factor, and the NCCN-IPI counts involvement of specific major organs (bone marrow, CNS, liver/GI tract, lung).","sources":"Abstracted imaging/staging documentation in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"BULKY_DISEASE","sketch":"Presence of bulky disease (single nodal mass above a size threshold, historically 10 cm or per-protocol cutoffs); Lugano recommends recording the longest diameter rather than a universal bulk cutoff.","sources":"Abstracted imaging reports in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"gist","name":"TUMOR_SIZE_CM","sketch":"Largest tumor diameter (cm), banded at <=2, >2-5, >5-10, >10 for risk assignment.","sources":"Pathology gross description; imaging when unresected.","coverage":"config_expressible"},{"tumour":"gist","name":"MITOTIC_RATE","sketch":"Mitoses per 5 mm2 (historically per 50 HPF), dichotomized at <=5 versus >5; with size and site, one of the three independent predictors of recurrence.","sources":"Pathology reports.","coverage":"config_expressible"},{"tumour":"gist","name":"TUMOR_RUPTURE_FLAG","sketch":"Tumor rupture before or during resection; treated as conferring high recurrence risk irrespective of other features.","sources":"Operative reports; abstracted surgical documentation.","coverage":"config_expressible"},{"tumour":"gist","name":"RESECTION_MARGIN_STATUS","sketch":"R0/R1/R2 classification of resection completeness; complete gross resection defined the Z9001 adjuvant population.","sources":"Pathology and operative reports.","coverage":"config_expressible"},{"tumour":"hnscc","name":"SURGICAL_MARGIN_STATUS","sketch":"Resection margin status (positive/close/negative) from surgical pathology; a positive margin is one of the two high-risk features for which adjuvant chemoradiation improves outcomes in the pooled EORTC 22931/RTOG 9501 analysis.","sources":"Abstracted surgical pathology reports in EHR-derived data.","coverage":"config_expressible"},{"tumour":"hnscc","name":"EXTRANODAL_EXTENSION","sketch":"Pathological extranodal (extracapsular) extension of nodal metastasis; a high-risk feature indicating adjuvant chemoradiation and, since AJCC 8th edition, a formal modifier of N category in non-viral HNSCC.","sources":"Abstracted surgical pathology reports; not reliably structured in EHR data.","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"PERIPHERAL_BLAST_PCT","sketch":"Circulating blast percentage on differential; >=1% scores in IPSS/DIPSS, >=2% in MIPSS70, >=3% in MYSEC-PM; 10-19% defines accelerated phase and >=20% blast phase.","sources":"CBC differential / peripheral smear results in EHR laboratory feeds","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"SPLEEN_SIZE_SPLENOMEGALY","sketch":"Baseline spleen assessment — palpable length in cm below the left costal margin and/or spleen volume by CT/MRI; trials required palpable spleen >=5 cm (COMFORT) and response criteria define measurable splenomegaly thresholds.","sources":"Physical exam findings in notes (abstraction/NLP); radiology reports; imaging volumetrics in trial-linked data","coverage":"config_expressible"},{"tumour":"mds","name":"BM_BLAST_PCT","sketch":"Bone marrow blast percentage; IPSS-R scores <=2, >2-<5, 5-10 and >10%, IPSS-M uses it continuously, and >=20% defines transformation to AML.","sources":"Bone marrow aspirate/biopsy pathology reports (abstracted)","coverage":"config_expressible"}],"engine":{"config":"clinical.categoricals","verification":"unit / declared only"}},{"name":"DISEASE_SYMPTOMS","category":"staging_histology","definition":"Constitutional or disease-defining symptoms recorded as a staging input — B symptoms in lymphoma, constitutional symptoms in myeloproliferative disease. Carried separately from comorbidity because they are a property of the cancer rather than of the patient.","slots":{"symptom_set":{"description":"which symptoms count and the rule that makes the flag positive","examples":{}},"timing":{"description":"the window relative to index or diagnosis","examples":{}}},"citations":["mCODE STU4 Lymphoma Stage Profile — B symptoms are an Ann Arbor staging input, which is where mCODE carries them: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-lymphoma-stage"],"uses":[{"tumour":"dlbcl","name":"B_SYMPTOMS","sketch":"Presence of fever, drenching night sweats, or unexplained weight loss at diagnosis; a classical staging modifier examined among prognostic factors in aggressive NHL and still abstracted in RWD baseline tables.","sources":"Abstracted clinician notes in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"CONSTITUTIONAL_SYMPTOMS","sketch":"Presence of weight loss >10%, unexplained fever or drenching night sweats; a one-point component of IPSS, DIPSS, MIPSS70 and MYSEC-PM.","sources":"Clinician notes (NLP/abstraction); symptom checklists in registries","coverage":"config_expressible"}],"engine":{"config":"clinical.categoricals","verification":"unit / declared only"}},{"name":"GENE_VARIANT_STATUS","category":"biomarkers","definition":"Presence, absence or unknown status of a variant in a named gene — BRAF, EGFR, KRAS, JAK2, CALR, MPL, KIT, BRCA1/2, TP53, IGHV and the chromosomal deletions reported the same way (del(17p), del(11q), del(13q)). ONE concept whose GENE and VARIANT SCOPE are parameters: a study asking for any KRAS mutation and one asking specifically for G12C are two definitions of one concept, and recording them as two concepts would hide exactly the difference that matters.","slots":{"gene":{"description":"the gene or locus tested, and the reference the delivery names it by","examples":{}},"variant_scope":{"description":"any pathogenic variant, a named variant (e.g. V600E, G12C, V617F), or a specified exon/region","examples":{}},"method":{"description":"the assay class the result is accepted from (NGS, PCR, FISH, karyotype) and whether results from several are pooled","examples":{}},"timing":{"description":"the window relative to index the test must fall in, and the rule for multiple results","examples":{}},"missing_policy":{"description":"how never-tested is distinguished from tested-and-negative, which is the distinction most often collapsed in RWD","examples":{}}},"citations":["mCODE STU4 Genomic Variant Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-genomic-variant"],"uses":[{"tumour":"ovarian","name":"BRCA_G","sketch":"Germline BRCA1/BRCA2 pathogenic/likely pathogenic variant status from blood-based testing; defines the population with largest PARP inhibitor maintenance benefit.","sources":"Abstracted genetic test reports (commercial germline panels) with test date and result","coverage":"config_expressible"},{"tumour":"ovarian","name":"BRCA_S","sketch":"Somatic (tumor) BRCA1/2 mutation status from tumor tissue sequencing; combined with germline status into overall BRCA-mutated vs wild-type in most RWD analyses.","sources":"Abstracted tumor NGS reports; linked clinico-genomic panels","coverage":"config_expressible"},{"tumour":"endometrial","name":"POLE","sketch":"POLE exonuclease-domain pathogenic hotspot mutation (ultramutated class), determined by targeted sequencing; confers excellent prognosis and downstages disease in FIGO 2023.","sources":"Abstracted NGS/targeted sequencing reports","coverage":"config_expressible"},{"tumour":"endometrial","name":"P53","sketch":"p53 status by IHC (aberrant overexpression or null pattern as surrogate for TP53 mutation) or sequencing; p53abn defines the poorest-prognosis molecular class.","sources":"Abstracted IHC/sequencing reports","coverage":"config_expressible"},{"tumour":"prostate","name":"BRCA12","sketch":"BRCA1/2 alteration status (germline and/or somatic) reported separately from the broader HRR panel, as the subgroup with clearest PARP inhibitor benefit.","sources":"Abstracted NGS/germline reports","coverage":"config_expressible"},{"tumour":"prostate","name":"AR_ALT","sketch":"Androgen receptor alterations, including AR amplification/mutations on NGS and AR splice variant 7 (AR-V7) in circulating tumor cells, associated with resistance to abiraterone/enzalutamide.","sources":"Abstracted NGS reports; CTC AR-V7 assay reports where available","coverage":"config_expressible"},{"tumour":"nsclc","name":"EGFR_MUT","sketch":"EGFR activating mutation status (positive/negative/untested), including sensitizing mutations relevant to EGFR TKI selection; test result plus specimen and result dates.","sources":"Abstracted molecular pathology reports and linked NGS results (Flatiron-Foundation Medicine CGDB); community network lab reports.","coverage":"config_expressible"},{"tumour":"nsclc","name":"BRAF_MUT","sketch":"BRAF mutation status (notably V600E) relevant to BRAF/MEK inhibitor therapy; captured as result plus test dates and method.","sources":"Abstracted molecular reports and linked NGS in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"nsclc","name":"KRAS_MUT","sketch":"KRAS mutation status, with G12C separated in more recent studies given targeted-therapy availability; historically the most common driver in Western aNSCLC cohorts.","sources":"Linked NGS/comprehensive genomic profiling and abstracted molecular reports in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"nsclc","name":"MET_ALT","sketch":"MET alterations, chiefly MET exon 14 skipping (and MET amplification), tested predominantly via NGS in later study periods.","sources":"Linked NGS results and abstracted molecular reports in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"cll","name":"IGHV_MUTATION_STATUS","sketch":"Somatic hypermutation of the rearranged IGHV gene; unmutated defined as >=98% germline identity and associated with aggressive disease. Stable over time; tested once, but under-tested in community practice.","sources":"Send-out molecular reports abstracted from EHR; registry biomarker forms.","coverage":"config_expressible"},{"tumour":"cll","name":"DEL17P_STATUS","sketch":"Deletion of 17p13 by FISH; the strongest adverse cytogenetic marker in the Döhner hierarchy and a CLL-IPI component directing away from chemoimmunotherapy.","sources":"FISH reports abstracted from EHR/lab feeds; tested at diagnosis and before each line.","coverage":"config_expressible"},{"tumour":"cll","name":"TP53_MUTATION_STATUS","sketch":"TP53 sequencing result, captured separately from del(17p) because either aberration confers chemoimmunotherapy resistance; iwCLL recommends testing before treatment decisions.","sources":"NGS/Sanger reports; poorly captured in community registries (11% tested in informCLL).","coverage":"config_expressible"},{"tumour":"cll","name":"DEL11Q_STATUS","sketch":"Deletion of 11q22-23 (ATM locus) by FISH; adverse marker in the Döhner hierarchy, historically associated with bulky nodes and shorter survival.","sources":"FISH panel reports.","coverage":"config_expressible"},{"tumour":"cll","name":"TRISOMY_12_STATUS","sketch":"Trisomy 12 by FISH; intermediate-risk lesion in the hierarchical FISH model.","sources":"FISH panel reports.","coverage":"config_expressible"},{"tumour":"cll","name":"DEL13Q_STATUS","sketch":"Deletion of 13q14 by FISH; most frequent aberration and favorable when isolated.","sources":"FISH panel reports.","coverage":"config_expressible"},{"tumour":"gist","name":"KIT_MUTATION_EXON","sketch":"KIT mutation presence and exon (11 most common, 9 enriched in small-bowel primaries); exon predicts imatinib response and dose sensitivity, so studies capture exon-level rather than binary status.","sources":"NGS/targeted sequencing reports abstracted from EHR.","coverage":"config_expressible"},{"tumour":"gist","name":"PDGFRA_MUTATION","sketch":"PDGFRA mutation presence and variant, with D842V called out specifically because it confers imatinib resistance but avapritinib sensitivity.","sources":"Molecular pathology reports.","coverage":"config_expressible"},{"tumour":"gist","name":"KIT_PDGFRA_WILDTYPE_FLAG","sketch":"Absence of KIT and PDGFRA mutations (\"wild-type GIST\"), a molecularly heterogeneous group subdivided by SDH status and rarer drivers.","sources":"Derived from sequencing results.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"DEL_17P","sketch":"Deletion of 17p13 (TP53 locus) by FISH; a high-risk abnormality in the IMWG consensus and a component of R-ISS/R2-ISS.","sources":"Abstracted FISH reports; genomic assays in CoMMpass.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"GAIN_AMP_1Q21","sketch":"Gain (3 copies) or amplification (4 or more copies) of 1q21 by FISH; adverse in the IMWG consensus and formally scored in R2-ISS.","sources":"Abstracted FISH reports; copy-number profiling in CoMMpass.","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"JAK2_V617F","sketch":"JAK2 V617F driver mutation status (positive/negative, often with allele burden); present in the majority of MF and defines driver-mutation subgroups with distinct outcomes.","sources":"Molecular pathology/PCR or NGS reports; biomarker tables in EHR-derived genomic linkages","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"CALR_MUTATION","sketch":"CALR exon 9 insertion/deletion status, subtyped as type 1/like versus type 2/like; CALR (especially type 1/like) confers favorable survival, and its absence scores in MIPSS70 and MYSEC-PM.","sources":"NGS/fragment-analysis molecular reports","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"MPL_MUTATION","sketch":"MPL W515 (or other exon 10) mutation status; smallest driver subgroup, carrying intermediate prognosis in driver-stratified analyses.","sources":"NGS panel or targeted PCR reports","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"HMR_MUTATIONS","sketch":"High-molecular-risk mutations — ASXL1, EZH2, SRSF2, IDH1/IDH2 (MIPSS70), plus U2AF1 Q157 in MIPSS70+ v2.0 — recorded per gene and as a count (>=2 HMR scores extra); ASXL1/SRSF2/EZH2 independently shorten survival.","sources":"NGS myeloid panel reports (abstracted or linked genomic data)","coverage":"config_expressible"},{"tumour":"mds","name":"DEL_5Q","sketch":"Deletion 5q status, including isolated del(5q) as a distinct WHO entity; predicts erythroid response and transfusion independence with lenalidomide.","sources":"Karyotype and FISH reports","coverage":"config_expressible"},{"tumour":"mds","name":"SF3B1_MUTATION","sketch":"SF3B1 mutation status; defines a distinct MDS subtype with ineffective erythropoiesis, favorable prognosis and ring sideroblast phenotype, and predicted benefit from luspatercept.","sources":"NGS myeloid panel reports","coverage":"config_expressible"},{"tumour":"mds","name":"TP53_ALLELIC_STATE","sketch":"TP53 mutation with allelic state (monoallelic versus multihit/biallelic, integrating VAF, deletion and copy-neutral LOH); multihit state — not TP53 mutation per se — drives complex karyotype, treatment resistance and dismal outcomes, and is a top IPSS-M variab","sources":"NGS reports with VAF plus cytogenetics/CNV data","coverage":"config_expressible"},{"tumour":"mcrc","name":"KRAS_MUT","sketch":"Activating KRAS mutation. Its presence excludes benefit from anti-EGFR antibodies, and extended testing beyond exon 2 changed which patients count as eligible when the PRIME population was re-analysed by full RAS status.","sources":"Molecular pathology reports and NGS panel results abstracted from EHR; structured biomarker tables in clinicogenomic databases.","coverage":"config_expressible"},{"tumour":"mcrc","name":"NRAS_MUT","sketch":"Activating NRAS mutation, tested alongside KRAS as part of extended RAS assessment. Real-world NRAS testing has lagged KRAS testing, so the untested fraction is a reportable quantity rather than an assumed wild type.","sources":"Molecular pathology and NGS panel results abstracted from EHR; structured biomarker tables.","coverage":"config_expressible"},{"tumour":"mcrc","name":"RAS_WILD_TYPE","sketch":"Derived pan-RAS wild-type status: no activating mutation across the tested KRAS and NRAS exons, with untested patients kept distinct from tested-negative ones. This is the eligibility gate for anti-EGFR therapy and the population in which sidedness is predicti","sources":"Derived from the KRAS and NRAS result columns together with the tested/not-tested indicator.","coverage":"config_expressible"},{"tumour":"mcrc","name":"BRAF_V600E","sketch":"BRAF V600E mutation — a minority of metastatic disease, prognostically adverse, enriched in right-sided primaries, and the target of encorafenib plus cetuximab in the previously treated setting. Non-V600 BRAF alterations behave differently and are kept as a se","sources":"Molecular pathology and NGS panel results abstracted from EHR.","coverage":"config_expressible"},{"tumour":"mcrc","name":"KRAS_G12C","sketch":"The specific KRAS G12C allele, reported separately from KRAS mutation as a class because it alone selects for a targeted combination; a KRAS-mutant result without allele detail cannot be resolved into this flag.","sources":"NGS panel allele calls abstracted from EHR; structured variant tables in clinicogenomic databases.","coverage":"config_expressible"}],"engine":{"config":"clinical.biomarkers","verification":"unit / declared only"}},{"name":"GENE_REARRANGEMENT","category":"biomarkers","definition":"A fusion or rearrangement involving a named gene — ALK, BCL2, BCL6 — and the composite calls built from several (double-hit, triple-hit, double-expressor). Separated from GENE_VARIANT_STATUS because the assay and the reporting convention differ, and a composite call is a rule over several rearrangements rather than one result.","slots":{"gene":{"description":"the gene or gene pair, and for composites the rule combining them","examples":{}},"method":{"description":"the assay the result is accepted from (FISH, NGS, IHC surrogate)","examples":{}},"missing_policy":{"description":"how not-tested is distinguished from negative","examples":{}}},"citations":["mCODE STU4 Genomic Variant Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-genomic-variant"],"uses":[{"tumour":"nsclc","name":"ALK_REARR","sketch":"ALK rearrangement status by FISH, IHC, or NGS; one of the five first-line-actionable biomarkers whose testing completeness before first-line therapy is a standard quality measure.","sources":"Abstracted molecular/cytogenetic reports in EHR-derived data; linked comprehensive genomic profiling.","coverage":"config_expressible"},{"tumour":"nsclc","name":"ROS1_REARR","sketch":"ROS1 rearrangement/fusion status; actionable alteration tested by FISH or NGS, with real-world testing rates and turnaround tracked alongside EGFR/ALK/BRAF/PD-L1.","sources":"Abstracted molecular reports and linked NGS in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"nsclc","name":"RET_REARR","sketch":"RET rearrangement/fusion status; actionable alteration whose testing uptake rose with NGS panel adoption and selective RET inhibitor approvals.","sources":"Linked NGS results and abstracted molecular reports in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"nsclc","name":"NTRK_FUSION","sketch":"NTRK1/2/3 gene fusion status, a tumor-agnostic actionable biomarker generally detected only on broad NGS panels; low prevalence with testing rates tracked as an access measure.","sources":"Linked NGS/comprehensive genomic profiling in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"MYC_REARR","sketch":"MYC rearrangement status by FISH or cytogenetics; required input for high-grade B-cell lymphoma with MYC and BCL2 and/or BCL6 rearrangements per WHO 2016.","sources":"Abstracted FISH/cytogenetics reports in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"BCL2_REARR","sketch":"BCL2 rearrangement status by FISH/cytogenetics, combined with MYC status to identify double-hit biology.","sources":"Abstracted FISH/cytogenetics reports in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"BCL6_REARR","sketch":"BCL6 rearrangement status by FISH/cytogenetics, combined with MYC (and BCL2) status for double/triple-hit classification.","sources":"Abstracted FISH/cytogenetics reports in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"DOUBLE_TRIPLE_HIT","sketch":"Derived flag for high-grade B-cell lymphoma with MYC and BCL2 and/or BCL6 rearrangements (double-hit or triple-hit), a distinct WHO 2016 entity with inferior outcomes; testing completeness varies in RWD.","sources":"Derived from abstracted FISH/cytogenetics results in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"DOUBLE_EXPRESSOR","sketch":"Co-expression of MYC and BCL2 protein by immunohistochemistry above conventional thresholds without the corresponding rearrangements; recognized in WHO 2016 as a prognostically adverse (non-entity) marker.","sources":"Abstracted IHC results in EHR-derived pathology data.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"T_4_14","sketch":"Translocation t(4;14) by FISH; high-risk IMWG abnormality and R-ISS/R2-ISS component.","sources":"Abstracted FISH reports; genomic assays in CoMMpass.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"T_14_16","sketch":"Translocation t(14;16) by FISH; high-risk IMWG abnormality included in R-ISS.","sources":"Abstracted FISH reports; genomic assays in CoMMpass.","coverage":"config_expressible"},{"tumour":"mcrc","name":"NTRK_FUSION","sketch":"NTRK gene fusion — rare in colorectal cancer, detected on fusion-capable NGS panels rather than hotspot assays, and actionable across tumour types, so it is tested for despite its low prevalence.","sources":"Fusion-capable NGS panel results abstracted from EHR.","coverage":"config_expressible"}],"engine":{"config":"clinical.biomarkers","verification":"unit / declared only"}},{"name":"PROTEIN_EXPRESSION","category":"biomarkers","definition":"Expression of a named protein or receptor, usually by immunohistochemistry — HER2, ER/PR, CD38, DLL3, FOLR1, mismatch-repair protein IHC. The positivity threshold is the parameter that decides the answer and it differs by study and by assay, so it is a slot rather than a constant.","slots":{"analyte":{"description":"the protein or receptor assessed","examples":{}},"method":{"description":"the assay and scoring system (e.g. IHC 0/1+/2+/3+, TPS/CPS percentage)","examples":{}},"positivity_threshold":{"description":"the cut-point that makes it positive, including how equivocal results are treated","examples":{}},"timing":{"description":"the window relative to index and the rule for multiple results","examples":{}}},"citations":["mCODE STU4 Tumor Marker Test Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-tumor-marker-test"],"uses":[{"tumour":"ovarian","name":"FOLR1","sketch":"Folate receptor alpha (FRa) IHC status with staining detail (percent staining, intensity, sample type) and result dates — the mirvetuximab-selection marker.","sources":"Abstracted IHC/molecular reports (NGS/biomarker source).","coverage":"config_expressible"},{"tumour":"endometrial","name":"MMR_IHC","sketch":"Mismatch repair status by IHC for MLH1/MSH2/MSH6/PMS2; dMMR = loss of >=1 protein (with MLH1 promoter methylation reflex to exclude Lynch); universal testing recommended by ESGO.","sources":"Abstracted pathology/IHC reports with test date and result","coverage":"config_expressible"},{"tumour":"endometrial","name":"ER_PR","sketch":"Estrogen/progesterone receptor expression by IHC (often >=1% or >=10% positivity thresholds); supports hormonal therapy selection in low-grade endometrioid disease.","sources":"Abstracted IHC reports","coverage":"config_expressible"},{"tumour":"endometrial","name":"HER2","sketch":"HER2 status (IHC 3+ or ISH-amplified) primarily in serous/p53-abnormal carcinoma; predictive of trastuzumab benefit added to carboplatin-paclitaxel.","sources":"Abstracted IHC/ISH reports","coverage":"config_expressible"},{"tumour":"nsclc","name":"PDL1_TPS","sketch":"PD-L1 expression as tumor proportion score from IHC (22C3, 28-8, SP142, or LDTs), reported in the clinically anchored bands under 1%, 1-49%, and 50% or higher that gate immunotherapy monotherapy eligibility.","sources":"Abstracted pathology/IHC reports in EHR-derived databases, with assay type captured.","coverage":"config_expressible"},{"tumour":"sclc","name":"DLL3_ASSESSMENT","sketch":"DLL3 expression assessment flag; tarlatamab targets DLL3 but pivotal-trial enrollment did not require expression testing, so real-world capture is exploratory.","sources":"Abstracted pathology/biomarker reports where tested.","coverage":"config_expressible"},{"tumour":"cll","name":"CD38_EXPRESSION","sketch":"Flow-cytometric CD38 positivity (common threshold >=30% of CLL cells); early surrogate prognostic marker correlated with unmutated IGHV.","sources":"Flow cytometry reports.","coverage":"config_expressible"},{"tumour":"cll","name":"ZAP70_EXPRESSION","sketch":"ZAP-70 expression (common threshold >=20%); studied by the CLL Research Consortium as an IGHV surrogate predicting shorter time to first treatment, though assay standardization limits routine use.","sources":"Specialized flow/IHC reports where performed.","coverage":"config_expressible"},{"tumour":"gist","name":"SDH_DEFICIENT_STATUS","sketch":"SDH deficiency by SDHB immunohistochemistry loss and/or SDHx mutation/epimutation; defines a young, gastric, imatinib-insensitive subgroup with indolent metastatic behavior.","sources":"IHC and germline/somatic testing reports.","coverage":"config_expressible"},{"tumour":"hnscc","name":"P16_IHC_STATUS","sketch":"p16 immunohistochemistry as the surrogate marker for HPV-associated oropharyngeal carcinoma, positive at 70 percent or greater nuclear and cytoplasmic staining with at least moderate intensity per the CAP guideline; required to assign AJCC8 oropharynx staging ","sources":"Abstracted pathology reports in EHR-derived data (dedicated p16/HPV fields in Flatiron-type oropharynx cohorts); not available in Medicare claims.","coverage":"config_expressible"},{"tumour":"hnscc","name":"PD_L1_CPS","sketch":"PD-L1 combined positive score from tumor tissue, analyzed as a stratification and subgroup variable (CPS >=1, CPS >=20) in trials adding pembrolizumab to chemoradiation and relevant to subsequent recurrent/metastatic therapy.","sources":"Abstracted pathology/biomarker reports in EHR-derived data.","coverage":"config_expressible"},{"tumour":"mcrc","name":"HER2_ERBB2","sketch":"HER2 (ERBB2) amplification or overexpression by IHC/ISH or NGS, largely confined to RAS wild-type disease. It became an actionable target once an anti-HER2 regimen was approved in the refractory setting, so testing dates in historical data often postdate the d","sources":"Pathology IHC/ISH reports and NGS amplification calls abstracted from EHR.","coverage":"config_expressible"}],"engine":{"config":"clinical.biomarkers","verification":"unit / declared only"}},{"name":"GENOMIC_SIGNATURE","category":"biomarkers","definition":"A composite genomic status computed over a panel rather than a single locus — homologous recombination deficiency, microsatellite instability and MMR status, HRR panel positivity, molecular subtype, gene-panel risk scores. The PANEL DEFINITION is the concept-defining parameter: two products both reporting HRD with different gene lists are not reporting the same variable.","slots":{"signature":{"description":"which composite is reported (HRD, MSI/MMR, HRR, molecular subtype, panel score)","examples":{}},"panel_definition":{"description":"the exact gene list or algorithm, and its version, that the composite is computed over","examples":{}},"threshold":{"description":"the cut-point or category set, and the label for indeterminate","examples":{}},"missing_policy":{"description":"how not-tested is distinguished from negative or indeterminate","examples":{}}},"citations":["mCODE STU4 Genomics Report Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-genomics-report","mCODE STU4 Genomic Region Studied Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-genomic-region-studied"],"uses":[{"tumour":"ovarian","name":"HRD","sketch":"Homologous recombination deficiency status, commonly a genomic instability score (LOH+TAI+LST) with positivity at score >=42 or tumor BRCA mutation (Myriad myChoice convention used in PAOLA-1/PRIMA).","sources":"Abstracted commercial HRD assay reports (e.g., myChoice CDx)","coverage":"config_expressible"},{"tumour":"endometrial","name":"MSI","sketch":"Microsatellite instability status by PCR/NGS (MSI-H vs MSS); analyzed jointly with MMR IHC as dMMR/MSI-H, the predictive biomarker for immune checkpoint benefit.","sources":"Abstracted molecular pathology/NGS reports","coverage":"config_expressible"},{"tumour":"endometrial","name":"MOLSUBTYPE","sketch":"Integrated molecular classification (TCGA-derived): POLEmut > MMRd > p53abn > NSMP assigned hierarchically from POLE sequencing, MMR IHC and p53 IHC; multiple-classifier tumors resolved by that hierarchy.","sources":"Derived from POLE, MMR_IHC and P53 variables","coverage":"config_expressible"},{"tumour":"prostate","name":"HRR_PANEL","sketch":"Homologous recombination repair gene alteration panel (BRCA1, BRCA2, ATM, and other prespecified genes such as CDK12, CHEK2, PALB2) from tumor and/or germline NGS; PARP inhibitor eligibility marker.","sources":"Abstracted tumor NGS and germline test reports; clinico-genomic linked databases","coverage":"config_expressible"},{"tumour":"nsclc","name":"TMB","sketch":"Tumor mutational burden (mutations/Mb) from comprehensive genomic profiling; explored as a predictor of benefit from PD-1/PD-L1 inhibitors in clinicogenomic cohorts.","sources":"Linked NGS panels (e.g., Foundation Medicine) in clinicogenomic databases.","coverage":"config_expressible"},{"tumour":"cll","name":"FISH_HIERARCHICAL_RISK","sketch":"Derived categorical variable assigning each patient to the single highest-risk FISH lesion (del17p > del11q > trisomy 12 > normal > del13q sole), per the Döhner model.","sources":"Derived from FISH component variables.","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"TRIPLE_NEGATIVE_STATUS","sketch":"Absence of JAK2, CALR and MPL driver mutations; associated with inferior overall and leukemia-free survival in PMF.","sources":"Derived from molecular reports covering all three drivers","coverage":"config_expressible"},{"tumour":"mds","name":"IPSSM_GENE_PANEL","sketch":"Per-gene mutation calls for the IPSS-M gene set (e.g., ASXL1, RUNX1, SRSF2, U2AF1, EZH2, DNMT3A, CBL, NRAS, KRAS, IDH2, ETV6, NPM1, FLT3, KMT2A-PTD and residual genes), with testing date and panel coverage.","sources":"NGS myeloid panel reports; linked genomic databases; registry molecular testing capture","coverage":"config_expressible"},{"tumour":"mcrc","name":"MSI_MMR_STATUS","sketch":"Microsatellite instability / mismatch-repair status by immunohistochemistry for the MMR proteins, a PCR microsatellite panel, or NGS. MSI-H/dMMR is a small fraction of metastatic disease and is the eligibility gate for first-line checkpoint inhibition; discord","sources":"Pathology and molecular reports abstracted from EHR; structured MSI/MMR fields in EHR-derived databases.","coverage":"config_expressible"}],"engine":{"config":"clinical.biomarkers","verification":"unit / stage"}},{"name":"TUMOR_MARKER_VALUE","category":"biomarkers","definition":"A quantitative tumour-marker result and any banding of it — CA-125, PSA, ctDNA burden, KELIM. Distinct from a lab value because the marker is used to characterise the tumour rather than the patient, and distinct from PROTEIN_EXPRESSION because the result is a measured quantity with units rather than a scored stain.","slots":{"analyte":{"description":"the marker measured","examples":{}},"units":{"description":"the units the delivery reports and the conversion applied, since unit mismatches between label and raw cut-off are a known source of silent error here","examples":{}},"window":{"description":"the window relative to index and the rule for selecting among several results","examples":{}},"banding":{"description":"the cut-points that categorise the value and the label for missing","examples":{}}},"citations":["mCODE STU4 Tumor Marker Test Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-tumor-marker-test"],"uses":[{"tumour":"ovarian","name":"CA125","sketch":"Serum CA-125 values (baseline and longitudinal); evaluability per GCIG requires elevated baseline >=2x ULN, and serial values feed response/progression and kinetics variables.","sources":"Structured laboratory results","coverage":"config_expressible"},{"tumour":"ovarian","name":"KELIM","sketch":"Modeled CA-125 elimination rate constant K computed from >=3 CA-125 values in the first 100 days of platinum chemotherapy; standardized KELIM >=1.0 indicates favorable intrinsic chemosensitivity.","sources":"Longitudinal structured CA-125 labs + chemotherapy administration dates (kinetic modeling)","coverage":"engine_gap"},{"tumour":"ovarian","name":"CTDNA","sketch":"Circulating tumour DNA test result, measurement and report date where delivered.","sources":"NGS/biomarker source (ctDNA report columns).","coverage":"config_expressible"},{"tumour":"prostate","name":"PSA_BASE","sketch":"Serum PSA at or nearest index (e.g., closest value in -60/+7 days); baseline for kinetics and response calculations.","sources":"Structured laboratory results","coverage":"engine_family"},{"tumour":"prostate","name":"PSA_KINETICS","sketch":"Longitudinal PSA-derived kinetics (nadir, doubling time, velocity) computed from serial values; PCWG3 recommends serial PSA capture at protocolized intervals rather than single-value decision-making.","sources":"Structured longitudinal PSA labs","coverage":"engine_gap"},{"tumour":"prostate","name":"TESTOSTERONE","sketch":"Serum testosterone with castrate threshold <50 ng/dL (1.7 nmol/L), required to establish castration resistance; often incompletely captured in RWD and imputed from continuous ADT exposure.","sources":"Structured laboratory results + ADT administration records","coverage":"config_expressible"},{"tumour":"mds","name":"SERUM_EPO","sketch":"Pre-treatment serum erythropoietin level; <=500 U/L (with low transfusion need) predicts ESA response in the validated Nordic decision model, and EPO strata (<200 vs 200-500 U/L) stratified COMMANDS.","sources":"EHR laboratory results (send-out lab feeds)","coverage":"config_expressible"}],"engine":{"config":"clinical.lab_values","verification":"unit / stage"}},{"name":"BIOMARKER_TEST_CONTEXT","category":"biomarkers","definition":"Whether biomarker testing happened at all, when, and by what method — separate from any result. A study reporting testing rates needs this, and collapsing it into a result variable is what turns never-tested into negative.","slots":{"scope":{"description":"which tests the flag covers (a named gene, a panel, any biomarker test)","examples":{}},"timing":{"description":"the window relative to index that counts as tested","examples":{}},"method":{"description":"which assay classes count as a test for this purpose","examples":{}}},"citations":["mCODE STU4 Genomics Report Profile: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-genomics-report"],"uses":[{"tumour":"prostate","name":"PSMA_PET","sketch":"PSMA imaging status (PSMA-avid disease on gallium/fluorine PSMA PET), the eligibility gate for 177Lu-PSMA-617 therapy.","sources":"Abstracted PET imaging reports","coverage":"config_expressible"},{"tumour":"nsclc","name":"NGS_PANEL_TESTING","sketch":"Receipt and type of biomarker testing (broad NGS panel vs single-gene/hotspot testing), with broad-based sequencing often defined as panels of 30+ genes; a core testing-landscape and equity measure.","sources":"Abstracted molecular test orders/reports in EHR-derived data; lab linkages.","coverage":"engine_gap"},{"tumour":"nsclc","name":"BIOMARKER_TEST_TIMING","sketch":"Dates of biomarker test order, specimen collection, and result, supporting turnaround-time metrics and the proportion of patients with complete actionable-biomarker results before first-line initiation.","sources":"Abstracted test metadata in EHR-derived networks (e.g., MYLUNG consortium within The US Oncology Network).","coverage":"config_expressible"},{"tumour":"sclc","name":"PD_L1_TESTING_RESULT","sketch":"PD-L1 testing occurrence and result; tested infrequently in SCLC and not required for chemo-IO, but captured where available (IMpower133/CASPIAN found benefit independent of PD-L1).","sources":"Abstracted pathology/biomarker reports in EHR-derived data.","coverage":"config_expressible"},{"tumour":"gist","name":"MUTATION_TESTING_PERFORMED","sketch":"Whether genotyping was performed at all — guidelines recommend it before therapy, but real-world testing is incomplete, making the flag itself an equity/quality variable.","sources":"Presence/absence of molecular reports in EHR.","coverage":"config_expressible"},{"tumour":"hnscc","name":"HPV_DIRECT_TEST","sketch":"Direct high-risk HPV testing (DNA/RNA in situ hybridization or PCR) where performed; the CAP guideline recommends p16 IHC as the primary test for oropharynx with direct testing in defined situations.","sources":"Abstracted pathology and molecular reports in EHR-derived data.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"FISH_TESTING_PERFORMED","sketch":"Indicator and date of interphase FISH cytogenetic testing on (ideally CD138-enriched) bone marrow; real-world analyses report substantial subsets untested or with incomplete panels, making this a required completeness variable.","sources":"Abstracted cytogenetics/FISH reports in EHR-derived data; central sequencing in CoMMpass.","coverage":"config_expressible"},{"tumour":"mcrc","name":"BIOMARKER_TEST_TIMING","sketch":"Whether and when each biomarker was tested relative to the metastatic diagnosis and to line start, together with the assay modality (single-gene tissue assay, tissue NGS panel, or plasma ctDNA). Real-world testing is incomplete and uneven — several markers sta","sources":"Test order and result metadata in EHR-derived biomarker tables; report dates on molecular pathology documents.","coverage":"config_expressible"}],"engine":{"config":"clinical.biomarkers","verification":"unit / stage"}}]};

function drawTimeline(hostId, t){
  const host = document.getElementById(hostId); if (!host) return;
  const W = Math.max(260, Math.floor(host.clientWidth || 600)), pl = 14, pr = 14;
  const X = d => pl + (d - t.min) / (t.max - t.min) * (W - pl - pr);
  const cw = 6.7, gap = 12;
  const bandLab = t.bands.map(b => { let lab = b.label, w = lab.length * cw; if (w > W - pl - pr - 8) { lab = b.short; w = lab.length * cw; } let x = X(b.from) + 6, anchor = "start"; if (x + w > W - pr) { x = W - pr; anchor = "end"; } if (anchor === "end" && x - w < pl) { x = pl; anchor = "start"; } return { b, lab, x, anchor }; });
  const halo = ' stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke"';
  const ms = t.marks.map(m => { const cx = X(m.d), w = m.t.length * cw; let anchor = "start", tx = cx + 10, above = false;
    if (tx + w > W - pr) { anchor = "end"; tx = cx - 10; }
    if (anchor === "end" && tx - w < pl) { above = true; anchor = "start"; tx = Math.max(pl, Math.min(W - pr - w, cx - w / 2)); }
    const s0 = above ? Math.min(tx, cx - 8) : (anchor === "start" ? cx - 8 : tx - w), e0 = above ? Math.max(tx + w, cx + 8) : (anchor === "start" ? tx + w : cx + 8);
    return { m, cx, tx, w, anchor, above, s: s0, e: e0 }; }).sort((a, b) => a.s - b.s);
  const rowsEnd = [], rowAbove = [];
  ms.forEach(o => { let r = rowsEnd.findIndex((e, k) => e + gap <= o.s && !(o.above || rowAbove[k])); if (r < 0) { r = rowsEnd.length; rowsEnd.push(0); rowAbove.push(false); } rowsEnd[r] = o.e; if (o.above) rowAbove[r] = true; o.row = r; });
  const top = 20, bandLabY = 40, y0 = 62, nrows = Math.max(1, rowsEnd.length);
  const rowY = []; let acc = y0; for (let k = 0; k < nrows; k++) { if (rowAbove[k]) acc += 16; rowY.push(acc); acc += 30; }
  const axisY = acc + 4, H = axisY + 44;
  const fillOf = { win: "var(--win)", undecided: "var(--undecided)", exclude: "var(--exclude)", follow: "var(--follow)" };
  const lineOf = { win: "var(--win-line)", undecided: "var(--amber)", exclude: "var(--bad)", follow: "var(--grey)" };
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="font-family:var(--sans)">`;
  t.bands.forEach(b => {
    const x1 = X(b.from), x2 = X(b.to), dash = b.kind === "undecided" ? ' stroke-dasharray="5 4"' : "";
    svg += `<rect x="${x1}" y="${bandLabY + 8}" width="${Math.max(2, x2 - x1)}" height="${axisY - bandLabY - 8}" fill="${fillOf[b.kind]}" stroke="${lineOf[b.kind]}" stroke-width="1.2"${dash} rx="3"/>`;
  });
  bandLab.forEach(o => { svg += `<text${halo} x="${o.x}" y="${bandLabY}" font-size="12" font-weight="500" fill="var(--ink)" text-anchor="${o.anchor}">${esc(o.lab)}</text>`; });
  const x0 = X(0), ilw = t.anchor.length * cw; let ia = "middle", ix = x0;
  if (x0 - ilw / 2 < pl) { ia = "start"; ix = Math.max(pl, x0 - 4); } else if (x0 + ilw / 2 > W - pr) { ia = "end"; ix = W - pr; }
  svg += `<line x1="${x0}" y1="${top + 2}" x2="${x0}" y2="${axisY}" stroke="var(--accent)" stroke-width="2"/>`;
  svg += `<text${halo} x="${ix}" y="${top - 6}" font-size="12" font-weight="600" fill="var(--accent-ink)" text-anchor="${ia}">${esc(t.anchor)}</text>`;
  svg += `<line x1="${pl}" y1="${axisY}" x2="${W - pr}" y2="${axisY}" stroke="var(--control)" stroke-width="1"/>`;
  const span = t.max - t.min, target = Math.max(3, Math.floor((W - pl - pr) / 64));
  const step = [1, 2, 5, 7, 10, 14, 15, 20, 30, 50, 60, 90, 100, 120, 180].find(s => span / s <= target) || 365;
  const ticks = []; for (let d = Math.ceil(t.min / step) * step; d <= t.max; d += step) ticks.push(d);
  if (ticks.indexOf(0) < 0) ticks.push(0);
  t.bands.forEach(b => { [b.from, b.to].forEach(d => { if (ticks.indexOf(d) < 0 && d > t.min && d < t.max) ticks.push(d); }); });
  ticks.sort((a, b) => a - b);
  const must = new Set([0].concat(...t.bands.map(b => [b.from, b.to])));
  const keep = [];
  ticks.filter(d => must.has(d)).concat(ticks.filter(d => !must.has(d))).forEach(d => { const x = X(d); if (keep.every(k => Math.abs(X(k) - x) >= 30)) keep.push(d); });
  ticks.forEach(d => { const x = X(d); svg += `<line x1="${x}" y1="${axisY}" x2="${x}" y2="${axisY + 5}" stroke="var(--control)"/>`; });
  keep.forEach(d => { const x = X(d); const a = x < pl + 12 ? "start" : x > W - pr - 12 ? "end" : "middle"; svg += `<text x="${x}" y="${axisY + 19}" font-size="11.5" fill="var(--muted)" text-anchor="${a}" style="font-family:var(--mono)">${dnum(d)}</text>`; });
  svg += `<text x="${W - pr}" y="${axisY + 37}" font-size="11.5" fill="var(--muted)" text-anchor="end">${esc(t.axis)}</text>`;
  ms.forEach(o => {
    const cy = rowY[o.row] + 8, k = o.m.k;
    const fill = k === "pick" ? "var(--ink)" : "var(--bg)", stroke = k === "ex" ? "var(--control)" : "var(--ink)", dash = k === "ex" ? ' stroke-dasharray="2.5 2"' : "";
    svg += `<line x1="${o.cx}" y1="${cy + 7}" x2="${o.cx}" y2="${axisY}" stroke="${k === "ex" ? "var(--line)" : "var(--control)"}" stroke-width="1" stroke-dasharray="2 3"/>`;
    svg += `<circle cx="${o.cx}" cy="${cy}" r="6" fill="${fill}" stroke="${stroke}" stroke-width="1.6"${dash}/>`;
    svg += `<text${halo} x="${o.tx}" y="${o.above ? cy - 12 : cy + 4}" font-size="12" fill="${k === "ex" ? "var(--muted)" : "var(--ink)"}" font-weight="${k === "pick" ? 600 : 400}" text-anchor="${o.anchor}">${esc(o.m.t)}</text>`;
  });
  host.innerHTML = svg + "</svg>";
}
