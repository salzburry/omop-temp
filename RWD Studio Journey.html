<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RWD Studio Journey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Same visual system as the RWD Studio review prototype: thin prototype band, slim header, bordered surfaces on white, one orange marker for "where you are". */
:root{
  color-scheme: light;
  --bg:#ffffff; --ink:#2b2b2b; --muted:#6b6b6b; --line:#e5e5e5; --control:#767676;
  --accent:#f36633; --accent-ink:#ac350f; --on-accent:#202020; --focus:#135cb0;
  --ok:#176b43; --amber:#826007; --grey:#626d78; --bad:#b3261e; --on-status:#ffffff;
  --band:#f6f6f5; --here:#fdf0ea; --disabled-bg:#f1f1f1;
  --win:#e6f0ea; --win-line:#176b43; --undecided:#fbf3df; --exclude:#f7e4e2; --follow:#eceff2;
  --chart:#56616c; --chart-track:#f0f1f2; --shadow:0 6px 24px rgba(0,0,0,.08);
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  --r:10px; --r-sm:8px; --r-lg:12px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--band);border:1px solid var(--line);border-radius:4px;padding:0 3px;overflow-wrap:anywhere}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600;line-height:1.25}
h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}
p{margin:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:12px}
[hidden]{display:none!important}

/* band + header */
.band{background:var(--band);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;padding:6px 16px;text-align:center}
.top{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wordmark{color:var(--accent-ink);font-weight:600;font-size:16px;letter-spacing:-.01em;text-decoration:none}
.prod{display:flex;gap:8px;align-items:baseline;min-width:0;flex-wrap:wrap;color:var(--muted);flex:1 1 260px}
.prod strong{color:var(--ink);font-weight:500}
.roles{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--control);border-radius:var(--r-sm);overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:0;border-left:1px solid var(--line);padding:5px 11px;cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--band)}
.seg button[aria-pressed="true"]{background:var(--here);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
.seg button:focus-visible{outline-offset:-2px}

/* journey stepper */
.journey{border-bottom:1px solid var(--line);padding:14px 24px 12px}
.journey ol{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:1120px}
.journey a{display:flex;flex-direction:column;gap:7px;text-decoration:none;color:var(--muted);min-width:0;padding:2px 2px 4px;border-radius:6px}
.journey a:hover .jname{color:var(--ink);text-decoration:underline}
.journey .bar{height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.journey .jrow{display:flex;gap:7px;align-items:center;min-width:0}
.journey .num{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--control);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--bg)}
.journey .jname{font-size:12.5px;overflow-wrap:anywhere;line-height:1.3}
.journey .done .bar{background:var(--ok)}
.journey .done .num{background:var(--ok);border-color:var(--ok);color:var(--on-status)}
.journey .done .jname{color:var(--ink)}
.journey .current .bar{background:var(--accent)}
.journey .current .num{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:500}
.journey .current .jname{color:var(--ink);font-weight:600}
.journey .jnow{display:none;font-size:12px;color:var(--muted);margin-top:6px}
.jstate{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

main{padding:24px 32px 64px;min-width:0}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead > div{min-width:0}
.sub{color:var(--muted);margin-top:4px;max-width:70ch}
.yourpart{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--band);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;font-size:13px}
.yourpart .label{white-space:nowrap}
.yourpart > span:last-child{min-width:0;flex:1 1 200px}

/* buttons */
.btn{text-decoration:none;display:inline-block;font:inherit;font-weight:500;border-radius:var(--r-sm);padding:7px 14px;border:1px solid var(--control);background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--band)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.go{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.go:hover{background:#000}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{background:var(--disabled-bg);border-color:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--focus);text-decoration:underline;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.stepfoot .btn.primary{white-space:normal;text-align:left}

/* pills + chips */
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;color:var(--on-status);white-space:nowrap;line-height:1.5}
.pill.ok{background:var(--ok)} .pill.amber{background:var(--amber)} .pill.grey{background:var(--grey)} .pill.bad{background:var(--bad)}
.chip{font:inherit;font-size:13px;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--control)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--here);font-weight:500}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.trace{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--band);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.filechip{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;background:var(--band);min-width:0;max-width:100%}
.filechip .fname{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere;min-width:0}
.warnchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--amber);color:var(--amber);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11.5px;color:var(--muted);white-space:nowrap}

/* cards / surfaces */
.card{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;background:var(--bg);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .big{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat p{font-size:13px;color:var(--muted)}

/* overview flow */
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;counter-reset:f}
.flow li{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.flow li:not(:last-child)::after{content:"";position:absolute;right:-9px;top:26px;width:8px;height:2px;background:var(--control)}
.flow .fnum{font-family:var(--mono);font-size:12px;color:var(--accent-ink);font-weight:500}
.flow h3{font-size:14px}
.flow p{font-size:12.5px;color:var(--muted)}
.who{display:flex;flex-direction:column;gap:3px;margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.who span{font-size:12px}
.who b{font-weight:500}
.lead{font-size:15px;max-width:62ch}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--bg);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.spect{min-width:900px;table-layout:fixed}
.spect col.c-id{width:170px}.spect col.c-var{width:170px}.spect col.c-per{width:150px}.spect col.c-val{width:210px}
.spect td{font-size:13px;overflow-wrap:anywhere}
.vid{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:13px}
.data{min-width:640px;font-family:var(--mono);font-size:12.5px}
.data td,.data th{white-space:nowrap;padding:8px 12px}
.data td.num{text-align:right}
.mapt{min-width:720px}
.mapt td{font-size:13px}
.mapt tr.flag td{background:#fffaf0}

/* form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;max-width:760px}
.form .full{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--control);border-radius:var(--r-sm);padding:7px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}

/* drafting */
.runlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.runlog li{display:flex;gap:10px;align-items:baseline;min-width:0}
.runlog li > span:last-child{min-width:0;overflow-wrap:anywhere}
.runlog .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--line);transform:translateY(1px)}
.runlog .done .dot{background:var(--ok)}
.runlog .now .dot{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.runlog .todo{color:var(--muted)}
@keyframes pulse{50%{opacity:.35}}
.meter{width:220px;max-width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok);transition:width .3s}
.dcard{display:flex;flex-direction:column;gap:14px}
.dcard header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dcard header > div{min-width:0}
.compare{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
.compare > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.specbox{background:var(--band);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;overflow-wrap:anywhere}
dl.draft{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:13.5px}
dl.draft dt{color:var(--muted);font-size:12px;padding-top:2px}
dl.draft dd{margin:0;overflow-wrap:anywhere}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:12px 0 0;font-family:var(--mono);font-size:12.5px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.qs{display:flex;flex-direction:column;gap:10px}
.q{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.q.answered{border-left-color:var(--ok)}
.q.mine{border-left-color:var(--focus)}
.q p{overflow-wrap:anywhere}
.choices{display:flex;gap:6px;flex-wrap:wrap}
.choices .chip{white-space:normal;text-align:left;border-radius:var(--r-sm)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.reason{font-size:12px;color:var(--muted)}
details{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 16px}
details.inline{border:0;padding:0}
summary{cursor:pointer;font-weight:500}
pre.typed{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--band);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;white-space:pre}
.tl{width:100%;min-width:0}
.tl svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.sw.fill{background:var(--ink)} .sw.hollow{background:var(--bg)} .sw.ex{border-color:var(--control);border-style:dashed;background:var(--bg)}
.sw.band{border-radius:3px;border-style:dashed;border-color:var(--amber);background:var(--undecided)}
.tlgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}

/* sources */
.tcard{display:flex;flex-direction:column;gap:10px}
.tcard header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cols{display:flex;gap:4px;flex-wrap:wrap}
.cols code{font-size:11.5px}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.prof .t{background:var(--chart-track);border-radius:3px;height:8px;overflow:hidden}
.prof .t span{display:block;height:100%;background:var(--chart)}
.prof .v{font-family:var(--mono);color:var(--ink)}

/* build */
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.stages li{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:12.5px;color:var(--muted)}
.stages .bar{height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.stages .done .bar{background:var(--ok)} .stages .done{color:var(--ink)}
.stages .now .bar{background:var(--accent)} .stages .now{color:var(--ink);font-weight:600}
.hash{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}

/* release */
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.checklist li:last-child{border-bottom:0}
.checklist li > div{min-width:0}
.remain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* library */
.hlink{font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 11px}
.hlink:hover{border-color:var(--control)}
.hlink[aria-current="page"]{border-color:var(--accent);background:var(--here)}
.liblayout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.liblist{display:flex;flex-direction:column;gap:8px;min-width:0}
.libitem{font:inherit;text-align:left;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.libitem:hover{border-color:var(--control)}
.libitem[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:var(--here)}
.libitem .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.libitem .nm{font-family:var(--mono);font-weight:500;font-size:13px;overflow-wrap:anywhere}
.libitem .l2{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.libpanel{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.libpanel table td{font-size:12.5px;overflow-wrap:anywhere}
.slott{min-width:380px}.uset{min-width:560px;table-layout:fixed}.uset col.u-t{width:110px}.uset col.u-n{width:150px}.uset col.u-c{width:150px}
.cites{margin:0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.used{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--band)}
.used p{font-size:13px;overflow-wrap:anywhere}
.ucs{display:flex;gap:6px;flex-wrap:wrap}
.uc{display:inline-flex;flex-direction:column;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:4px 10px;font-size:12px;min-width:0;max-width:100%}
.uc b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.uc span{color:var(--muted);overflow-wrap:anywhere}
.chip.sugg{border-style:dashed;border-color:var(--focus);color:var(--focus)}
.libtile{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px}
.libtile:hover{border-color:var(--control)}
@media (max-width:760px){.uset,.uset tbody,.uset tr,.uset td,.slott,.slott tbody,.slott tr,.slott td{display:block;min-width:0;width:auto}.uset thead,.uset colgroup,.slott thead{display:none}.uset tr,.slott tr{border-bottom:1px solid var(--line);padding:10px 12px}.uset tbody tr:last-child,.slott tbody tr:last-child{border-bottom:0}.uset td,.slott td{border:0;padding:2px 0}.uset td:first-child{font-weight:600}}
@media (max-width:1100px){.liblayout{grid-template-columns:minmax(0,1fr)}.libpanel{position:static;max-height:none;order:-1}}

/* dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(32,32,32,.28);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:var(--r-sm);padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);font-size:13px;z-index:30}
.foot{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
[tabindex="-1"]:focus{outline:none}

@media (max-width:1100px){
  .flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .flow li:nth-child(3)::after{display:none}
  .grid5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tlgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .top{padding:10px 16px;gap:8px 12px}
  .journey{padding:12px 16px 10px}

rt; maintenance agents appended to the induction line rather than counted as a new line).","sources":"Oncologist-defined, rule-based line-of-therapy tables built from drug orders/administrations in EHR-derived databases (Flatiron-style)","coverage":"engine_family"},{"tumour":"endometrial","name":"DXDATE","sketch":"Date of initial endometrial cancer diagnosis abstracted from pathology/clinician documentation; anchors staging, recurrence and treatment sequencing.","sources":"Chart abstraction (pathology report) + structured diagnosis codes","coverage":"engine_family"},{"tumour":"endometrial","name":"ADVREC_INDEX","sketch":"Cohort entry as primary advanced (FIGO stage III-IV) or recurrent endometrial cancer; index commonly set at start of first-line systemic therapy for advanced/recurrent disease.","sources":"Abstracted stage + abstracted recurrence date + derived line-of-therapy table","coverage":"engine_family"},{"tumour":"endometrial","name":"LOTINDEX","sketch":"Line-of-therapy conventions for advanced/recurrent disease: first line = first systemic regimen for advanced/recurrent disease (platinum doublet most common); maintenance immunotherapy attributed to the induction line; adjuvant-only chemotherapy not counted as","sources":"Rule-based line derivation from structured drug orders/administrations","coverage":"engine_family"},{"tumour":"prostate","name":"DXDATE","sketch":"Date of initial prostate cancer diagnosis (biopsy/pathology date), anchoring de novo vs recurrent metastatic classification and disease-course timelines.","sources":"Chart abstraction (pathology) + structured diagnosis codes","coverage":"engine_family"},{"tumour":"prostate","name":"METDATE","sketch":"Date of first documented metastatic disease (radiographic or pathologic), abstracted from imaging reports and clinician notes; index for mHSPC cohorts.","sources":"Abstracted imaging/clinician documentation of metastasis","coverage":"engine_family"},{"tumour":"prostate","name":"CRPC_DATE","sketch":"Date castration resistance is met: disease progression (PSA and/or radiographic/clinical) despite castrate testosterone <50 ng/dL on continuous ADT or after orchiectomy, per PCWG3-style criteria; chart-confirmed in EHR-derived mCRPC cohorts.","sources":"Abstracted clinician documentation + PSA/testosterone labs + ADT exposure","coverage":"engine_family"},{"tumour":"prostate","name":"LOTINDEX_MCRPC","sketch":"First-line mCRPC index: first life-prolonging therapy (NHA, taxane, radium-223, sipuleucel-T) initiated on/after the mCRPC date; lines advanced by switch/addition of life-prolonging agents.","sources":"Derived line-of-therapy table restricted to post-CRPC therapy","coverage":"engine_family"},{"tumour":"nsclc","name":"ADV_DX_DATE","sketch":"Date the patient is first diagnosed with advanced disease (stage IIIB/IV at initial diagnosis, or the date of recurrence/progression to advanced disease for early-stage patients); the standard index date for Flatiron-style aNSCLC cohorts and the anchor for OS ","sources":"Chart abstraction of clinician notes, pathology and imaging reports in EHR-derived databases (Flatiron Health); registry stage plus claims-based recurrence algo","coverage":"engine_family"},{"tumour":"nsclc","name":"INITIAL_DX_DATE","sketch":"Date of first NSCLC diagnosis of any stage; used with group stage at initial diagnosis to distinguish de-novo advanced disease from recurrent disease and to benchmark cohorts against registries.","sources":"Abstracted pathology/clinician documentation in EHR-derived databases; registry diagnosis date in SEER/NPCR linkages.","coverage":"engine_family"},{"tumour":"nsclc","name":"LINE_START_DATE","sketch":"Start date of a systemic therapy line (e.g., first-line initiation after advanced diagnosis); the alternative index convention for treated cohorts and the anchor for line-based endpoints such as rwPFS, rwTTD, and TTNT.","sources":"Structured medication administration and oral prescription records in EHR-derived data, grouped into lines by rule-based algorithms; claims fill/administration ","coverage":"engine_family"},{"tumour":"sclc","name":"ES_SCLC_INDEX_DATE","sketch":"Index date anchored at diagnosis of extensive-stage disease — either initial ES-SCLC diagnosis or the date of progression to extensive stage from limited-stage disease. Trials and real-world follow-ons index untreated ES-SCLC at first-line treatment start as a","sources":"Abstracted diagnosis date plus staging documents in EHR-derived databases (Flatiron, ConcertAI); registry date of diagnosis in SEER.","coverage":"engine_family"},{"tumour":"sclc","name":"FIRST_LINE_START_DATE","sketch":"Date of first systemic therapy administration after ES diagnosis; used as treatment-based index in comparative-effectiveness designs and as the anchor for line-of-therapy clocks.","sources":"Structured medication administration/orders in EHR; Part B/D claims in SEER-Medicare.","coverage":"engine_family"},{"tumour":"dlbcl","name":"DLBCL_DX_DATE","sketch":"Date of initial DLBCL diagnosis; unlike aNSCLC, DLBCL real-world cohorts index on diagnosis (potentially curable disease with defined treatment intent) rather than on an advanced-disease date, with endpoints such as EFS24 anchored to diagnosis or first treatme","sources":"Abstracted pathology reports and clinician documentation in EHR-derived databases (COTA, Flatiron hematology); registry diagnosis dates.","coverage":"engine_family"},{"tumour":"dlbcl","name":"FIRST_LINE_START_DATE","sketch":"Date of first-line systemic therapy initiation after DLBCL diagnosis; common secondary index for treated cohorts and the anchor for line-based outcome measures.","sources":"Structured medication records grouped into lines in EHR-derived databases; claims administrations.","coverage":"engine_family"},{"tumour":"cll","name":"CLL_DIAGNOSIS_DATE","sketch":"Date CLL diagnostic criteria are met per iwCLL 2018 — clonal B lymphocytes >=5 x 10^9/L with characteristic immunophenotype; the diagnosis-based index for natural-history and watch-and-wait cohorts.","sources":"Abstracted diagnosis date plus flow cytometry reports in EHR; registry diagnosis date.","coverage":"engine_family"},{"tumour":"cll","name":"FIRST_TREATMENT_INITIATION_DATE","sketch":"Date of first CLL-directed systemic therapy; treatment-based index convention used by prospective real-world registries (informCLL enrolls at initiation of an approved therapy) and comparative studies.","sources":"Structured medication orders/administrations; registry enrollment forms.","coverage":"engine_family"},{"tumour":"gist","name":"GIST_DIAGNOSIS_DATE","sketch":"Date of histologic GIST diagnosis; population-based studies index at diagnosis, while advanced-disease studies re-index at unresectable/metastatic diagnosis or first TKI start.","sources":"Pathology reports in EHR; SEER diagnosis date (GIST separately identifiable by histology coding).","coverage":"engine_family"},{"tumour":"gist","name":"RESECTION_DATE","sketch":"Date of macroscopically complete resection of primary GIST; the index anchor for recurrence-free survival and adjuvant-therapy analyses.","sources":"Surgical/procedure records; registry surgery fields.","coverage":"engine_family"},{"tumour":"hnscc","name":"INDEX_DATE_DIAGNOSIS","sketch":"Date of initial diagnosis of locally advanced HNSCC, used to anchor baseline characteristic windows and diagnosis-based survival. In registry-linked data it is the registry diagnosis date; in EHR-derived data it is abstracted from pathology and clinician docum","sources":"Abstracted pathology report or clinician note date in EHR-derived databases (Flatiron, ConcertAI, Ontada/US community networks); registry diagnosis date in SEER","coverage":"engine_family"},{"tumour":"hnscc","name":"INDEX_DATE_TREATMENT_START","sketch":"Date of initiation of primary curative-intent treatment (surgery, radiotherapy, or first systemic dose), commonly used as the index date for treated LA-HNSCC cohorts and for real-world EFS and OS.","sources":"Structured medication administration and abstracted radiotherapy/surgery dates in EHR-derived data; first treatment claim within a window after diagnosis in SEE","coverage":"engine_family"},{"tumour":"multiple_myeloma","name":"INDEX_DATE_DIAGNOSIS","sketch":"Date of initial multiple myeloma diagnosis meeting IMWG criteria (clonal plasma cells plus SLiM-CRAB myeloma-defining events), anchoring NDMM cohorts and diagnosis-based survival.","sources":"Abstracted diagnosis date from pathology/clinician documentation in EHR-derived data (Flatiron MM, ConcertAI, COTA); enrollment at diagnosis in MMRF CoMMpass.","coverage":"engine_family"},{"tumour":"multiple_myeloma","name":"LINE_OF_THERAPY_INDEX","sketch":"Per-line index date at the start of each line of therapy, with new lines defined per IMWG uniform-reporting rules (regimen change or re-initiation after progression or unplanned gap); RWD studies analyze baseline and outcomes per line.","sources":"Oncologist-defined or algorithmic line-of-therapy tables derived from structured drug episodes in EHR-derived databases.","coverage":"engine_family"},{"tumour":"myelofibrosis","name":"INDEX_DATE","sketch":"Anchor date for follow-up — MF diagnosis date or first-line (usually JAK-inhibitor) initiation date; Medicare studies also index on drug-approval eras to compare pre/post-ruxolitinib survival.","sources":"Abstracted diagnosis date in EHR-derived datasets; first claim/administration date in claims data; registry enrollment date","coverage":"engine_family"},{"tumour":"mds","name":"INDEX_DATE","sketch":"Anchor date — MDS diagnosis date, registry enrollment, or first-line therapy start (e.g., first HMA dose in comparative-effectiveness SEER-Medicare analyses).","sources":"Abstracted diagnosis date; first HMA claim; registry enrollment date","coverage":"engine_family"},{"tumour":"mcrc","name":"MCRC_DX_DATE","sketch":"Date metastatic (stage IV) colorectal cancer is established — the initial diagnosis date when disease is already metastatic at presentation, or the date distant recurrence is documented after earlier-stage disease. The dominant index anchor for mCRC real-world","sources":"Abstracted diagnosis and staging documents in EHR-derived oncology databases (Flatiron, ConcertAI); registry date of diagnosis plus stage in SEER.","coverage":"engine_family"},{"tumour":"mcrc","name":"INITIAL_CRC_DX_DATE","sketch":"Date of the first colorectal cancer diagnosis at any stage. Paired with the metastatic date it yields the interval that separates synchronous from metachronous presentation and supplies the denominator for time-from-diagnosis descriptors.","sources":"Structured EHR diagnosis records and abstracted pathology; registry diagnosis date.","coverage":"engine_family"},{"tumour":"mcrc","name":"FIRST_LINE_START_DATE","sketch":"Date the first systemic therapy line for metastatic disease starts; the treatment-based index used for line-anchored endpoints and for comparative designs that must not carry the immortal time between diagnosis and treatment initiation.","sources":"Structured administration and order records in EHR-derived data; Part B/D fills in SEER-Medicare.","coverage":"engine_family"}],"engine":{"config":"data_product.study, data_product.index_dates, data_product.cohorts","verification":"unit / stage"}},{"name":"COHORT_ELIGIBILITY","category":"eligibility_index","definition":"Chart-confirmed cohort membership: histologically/clinically confirmed diagnosis of the tumour under study, with protocol exclusions. In large EHR-derived databases increasingly via model-assisted cohort selection — an ML model pre-screens likely-eligible patients and human abstractors confirm, with a documented bias analysis of the resulting cohort.","slots":{"confirmation":{"description":"what confirms membership (pathology abstraction, code algorithm, registry review) and which presentations are excluded","examples":{}}},"citations":["Birnbaum B et al. 2020, arXiv:2001.09765"],"uses":[{"tumour":"ovarian","name":"COHORT_ELIG","sketch":"Chart-confirmed cohort eligibility, increasingly via model-assisted cohort selection: an ML model pre-screens likely-eligible patients and human abstractors confirm, with bias analysis of the resulting cohort.","sources":"ICD-code screen + ML pre-selection + human chart abstraction","coverage":"engine_family"},{"tumour":"endometrial","name":"COHORT_ELIG","sketch":"Chart-confirmed eligibility (histology-confirmed endometrial carcinoma, exclusion of sarcomas per protocol), often with model-assisted cohort selection plus abstractor confirmation.","sources":"ICD screen + ML pre-selection + human abstraction","coverage":"engine_family"},{"tumour":"prostate","name":"COHORT_ELIG","sketch":"Chart-confirmed cohort eligibility (metastatic disease confirmed by abstraction, exclusion of second primaries), optionally with model-assisted cohort selection and bias analysis.","sources":"ICD screen + ML pre-selection + human abstraction","coverage":"engine_family"},{"tumour":"sclc","name":"HISTOLOGY_CONFIRMED_SCLC","sketch":"Eligibility criterion requiring histologically or cytologically confirmed small-cell lung cancer, usually via ICD-O-3 morphology codes or chart-confirmed pathology; mixed NSCLC/SCLC histology handled by rule.","sources":"Pathology reports abstracted from EHR; ICD-O-3 morphology in SEER/registry data.","coverage":"engine_family"},{"tumour":"cll","name":"CLL_VS_SLL_DESIGNATION","sketch":"Classification of CLL versus small lymphocytic lymphoma (same disease, nodal presentation with lymphocytes <5 x 10^9/L) per iwCLL; cohorts commonly pool CLL/SLL.","sources":"Abstracted pathology and clinical documentation.","coverage":"engine_family"},{"tumour":"gist","name":"IHC_CONFIRMATION","sketch":"Diagnostic confirmation by KIT (CD117) immunohistochemistry (with DOG1 in later practice) per the NIH/consensus diagnostic approach; guards against pre-2001 misclassification as leiomyosarcoma.","sources":"Abstracted pathology reports.","coverage":"engine_family"},{"tumour":"hnscc","name":"LA_COHORT_ELIGIBILITY","sketch":"Cohort entry rule requiring histologically confirmed squamous cell carcinoma of an eligible head and neck site with AJCC stage III-IVB (non-metastatic, M0) disease in adults; excludes recurrent/metastatic presentations and nasopharynx in most US studies.","sources":"Combination of abstracted stage, ICD-O topography/histology, and treatment records; registry stage fields in SEER-Medicare.","coverage":"engine_family"},{"tumour":"myelofibrosis","name":"MF_DIAGNOSIS","sketch":"Confirmed diagnosis of myelofibrosis (PMF per WHO criteria, or post-PV/post-ET MF per IWG-MRT criteria). Claims studies typically use ICD-9-CM 238.76 / ICD-10-CM D47.4 or D75.81, sometimes requiring two codes or specialist confirmation.","sources":"Structured EHR diagnosis codes with clinician abstraction (Flatiron-style); SEER/Medicare claims algorithms; registry case-report forms (MOST)","coverage":"engine_family"},{"tumour":"mds","name":"MDS_DIAGNOSIS","sketch":"Confirmed MDS diagnosis; claims studies use ICD-9-CM 238.72-238.75 / ICD-10-CM D46.x, with validation work showing cancer registries capture only a fraction of claims-identifiable MDS cases.","sources":"EHR diagnosis codes plus pathology confirmation (abstraction); SEER-Medicare linked claims algorithms; registry central review (Connect)","coverage":"engine_family"},{"tumour":"mcrc","name":"HISTOLOGY_CONFIRMED_CRC","sketch":"Eligibility criterion requiring pathology-confirmed colorectal adenocarcinoma (ICD-O-3 topography C18-C20 with adenocarcinoma morphology); appendiceal and anal primaries are conventionally excluded and neuroendocrine histology is handled by a separate rule.","sources":"Pathology reports abstracted from EHR; ICD-O-3 site and morphology in registry data.","coverage":"engine_family"},{"tumour":"mcrc","name":"TREATMENT_NAIVE_AT_INDEX","sketch":"Criterion that no systemic therapy for metastatic disease preceded the index. Adjuvant therapy completed before recurrence is normally allowed, sometimes behind a minimum disease-free interval, because whether it counts decides what the first line is.","sources":"Structured treatment history plus abstracted prior-therapy fields in EHR-derived data.","coverage":"engine_family"}],"engine":{"config":"data_product.lot, data_product.treatment_status","verification":"unit / stage"}},{"name":"DATA_CONTINUITY","category":"eligibility_index","definition":"A structured-activity/observability requirement (e.g. at least two documented visits or drug episodes after diagnosis) ensuring the patient is actually observed in the database; the last structured activity date is the standard censoring anchor for survival endpoints.","slots":{"min_activity":{"description":"the minimum documented activity that makes a patient observable, and the definition of the last-activity censoring date","examples":{}}},"citations":["Zhang Q et al. 2021, Health Serv Res, PMID 33998685","Stewart M et al. 2019, JCO Clin Cancer Inform, PMID 31335166"],"uses":[{"tumour":"ovarian","name":"STRUCTACT","sketch":"Structured-activity/data-continuity requirement (e.g., >=2 documented visits or drug episodes after diagnosis) used to ensure observability; last structured activity date is the censoring anchor.","sources":"Structured visit, laboratory and medication administration records","coverage":"engine_family"},{"tumour":"prostate","name":"FOLLOWUP_GATE","sketch":"The minimum-potential-follow-up gate (ID3MOSFU: index_end minus index date >= ~3 months) that every time-to-event variable is conditioned on.","sources":"Derived from the study window and index date.","coverage":"engine_family"},{"tumour":"sclc","name":"EHR_ACTIVITY_CRITERION","sketch":"Requirement of a minimum number of documented clinic encounters (commonly two or more visits) within the network after the diagnosis date, to ensure longitudinal capture in EHR-derived cohorts.","sources":"Structured visit records in Flatiron/ConcertAI-type databases.","coverage":"engine_family"},{"tumour":"mcrc","name":"EHR_ACTIVITY_CRITERION","sketch":"Requirement of a minimum number of documented visits in the network after the metastatic diagnosis (commonly two or more), so that patients seen once and then lost do not enter the cohort as immediate censors.","sources":"Structured visit records in EHR-derived databases.","coverage":"engine_family"}],"engine":{"config":"clinical.min_avail_date, outcomes.min_followup_days","verification":"unit / stage"}},{"name":"AGE","category":"demographics","definition":"Age in years at the index anchor (diagnosis or line start), usually reported as median plus categories, with top-coding above 85 years common for de-identification in EHR-derived data.","slots":{"anchor":{"description":"the event age is computed at (diagnosis vs index line start)","examples":{}},"top_code":{"description":"the de-identification top-code, where the source imposes one","examples":{}}},"citations":["Ma X et al. 2020, medRxiv, DOI 10.1101/2020.03.16.20037143"],"uses":[{"tumour":"ovarian","name":"AGE_INDEX","sketch":"Age at diagnosis or at index line start, usually in years and often categorized (e.g., <65 vs >=65); birth year may be masked for de-identification in EHR-derived data.","sources":"Structured EHR demographics","coverage":"engine_family"},{"tumour":"endometrial","name":"AGE_INDEX","sketch":"Age at diagnosis or at first-line initiation for advanced/recurrent disease; typically reported as median and categories.","sources":"Structured EHR demographics","coverage":"engine_family"},{"tumour":"prostate","name":"AGE_INDEX","sketch":"Age at metastatic diagnosis or at line index; metastatic prostate RWD cohorts skew older than trial populations.","sources":"Structured EHR demographics","coverage":"engine_family"},{"tumour":"nsclc","name":"AGE","sketch":"Age at advanced diagnosis (or at index/line start), usually reported in categories with top-coding above 85 years for de-identification.","sources":"Structured EHR birth year; registry demographics in SEER-Medicare.","coverage":"engine_family"},{"tumour":"sclc","name":"AGE_AT_INDEX","sketch":"Age in years at the index date (ES diagnosis or first-line start), typically top-coded (e.g., 85+) for de-identification.","sources":"EHR demographics table; registry birth year.","coverage":"engine_family"},{"tumour":"dlbcl","name":"AGE","sketch":"Age at diagnosis; prognostic in the IPI as a binary over-60 factor and in the NCCN-IPI as a graded factor (41-60, 61-75, over 75).","sources":"Structured EHR demographics; registry records.","coverage":"engine_family"},{"tumour":"cll","name":"AGE_AT_INDEX","sketch":"Age at diagnosis or treatment-initiation index; CLL trials segment by age/fitness, so age underpins CIT-eligibility definitions.","sources":"EHR demographics.","coverage":"engine_family"},{"tumour":"gist","name":"AGE_AT_INDEX","sketch":"Age at diagnosis/index; median GIST diagnosis age is around 60 in population data, with pediatric/young-adult cases enriched for SDH deficiency.","sources":"EHR demographics; registry.","coverage":"engine_family"},{"tumour":"hnscc","name":"AGE_AT_INDEX","sketch":"Age in years at diagnosis or treatment index, reported continuously and in bands; an effect modifier for chemotherapy benefit in MACH-NC.","sources":"Structured EHR demographics table; Medicare enrollment file in SEER-Medicare.","coverage":"engine_family"},{"tumour":"multiple_myeloma","name":"AGE_AT_INDEX","sketch":"Age in years at diagnosis or at each line index; also a practical transplant-eligibility proxy.","sources":"Structured EHR demographics; Medicare enrollment in SEER-Medicare.","coverage":"engine_family"},{"tumour":"myelofibrosis","name":"AGE_AT_DIAGNOSIS","sketch":"Age at MF diagnosis (or index); age >65 years scores in IPSS and DIPSS, and age is a continuous component of MYSEC-PM for secondary MF.","sources":"EHR/claims birth-year fields; registry demographics","coverage":"engine_family"},{"tumour":"mds","name":"AGE_AT_DIAGNOSIS","sketch":"Age at diagnosis/index; MDS is a disease of older adults (median ~70s) and age refines survival prediction as an IPSS-R additional feature (IPSS-RA).","sources":"EHR/claims demographics","coverage":"engine_family"},{"tumour":"mcrc","name":"AGE_AT_INDEX","sketch":"Age in years at the index date, typically top-coded above 85 for de-identification and reported both continuously and in bands.","sources":"Structured EHR birth year; registry demographics in SEER-Medicare.","coverage":"engine_family"}],"engine":{"config":"demographics.age_bands","verification":"component / component"}},{"name":"AGEGR1","category":"demographics","definition":"The categorical age-band variable derived from AGE. The band edges are a per-product parameter — the same variable, different cutpoints — which is the canonical example of a parameter slot: the definition never moves, the bands do.","slots":{"bands":{"description":"the eligibility floor and band edges, from the product's approved workbook","examples":{"illustrative_default":"18+: 18-45, 45-65, 65+ (illustrative operator example, not literature-derived)","illustrative_ovarian":"18+: 18-40, 40-65, 65+ (illustrative operator example, not literature-derived)","illustrative_gist":"21+: 21-45, 45-75, 75+ (illustrative operator example, not literature-derived)"}}},"citations":["Ma X et al. 2020, medRxiv, DOI 10.1101/2020.03.16.20037143"],"uses":[{"tumour":"mcrc","name":"AGE_GROUP","sketch":"Banded age at index. Colorectal bands almost always carry an explicit under-50 (early-onset) cut, because incidence in adults under 50 is rising while it falls in older adults, and early-onset disease presents at more advanced stage.","sources":"Derived from age at the index date.","coverage":"engine_family"}],"engine":{"config":"demographics.age_bands","verification":"component / component"}},{"name":"SEX","category":"demographics","definition":"Patient sex as recorded in structured demographics; standard baseline characteristic and stratification covariate.","slots":{"applicability":{"description":"whether the tumour restricts the cohort by sex (e.g. prostate)","examples":{}}},"citations":["Ma X et al. 2020, medRxiv, DOI 10.1101/2020.03.16.20037143"],"uses":[{"tumour":"ovarian","name":"GENDER","sketch":"Patient sex/gender as delivered (Panoramic BirthSex), label + code.","sources":"Structured demographics; cohort is female-filtered at eligibility.","coverage":"config_expressible"},{"tumour":"nsclc","name":"SEX","sketch":"Patient sex as recorded in the medical record; standard stratification/adjustment covariate benchmarked against national registries.","sources":"Structured EHR demographics; registry records.","coverage":"config_expressible"},{"tumour":"sclc","name":"SEX","sketch":"Administrative sex recorded in the EHR or registry; a stratification factor in IMpower133 and routinely reported in real-world baselines.","sources":"EHR demographics; registry.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"SEX","sketch":"Patient sex as documented in the record; standard baseline characteristic in real-world DLBCL cohorts.","sources":"Structured EHR demographics.","coverage":"config_expressible"},{"tumour":"cll","name":"SEX","sketch":"Administrative sex; male sex is a consistently reported adverse-prognosis covariate in CLL cohorts.","sources":"EHR demographics; registry.","coverage":"config_expressible"},{"tumour":"gist","name":"SEX","sketch":"Administrative sex; slight male predominance in population-based GIST series.","sources":"EHR demographics; registry.","coverage":"config_expressible"},{"tumour":"hnscc","name":"SEX","sketch":"Patient sex as recorded in structured demographics.","sources":"Structured EHR demographics; SEER registry demographics.","coverage":"config_expressible"},{"tumour":"multiple_myeloma","name":"SEX","sketch":"Patient sex as recorded in structured demographics.","sources":"Structured EHR demographics.","coverage":"config_expressible"},{"tumour":"myelofibrosis","name":"SEX","sketch":"Patient sex; MIPSS70+ v2.0 uses sex-adjusted hemoglobin thresholds for severe/moderate anemia.","sources":"EHR demographics table; claims enrollment files","coverage":"config_expressible"},{"tumour":"mds","name":"SEX","sketch":"Patient sex; reported in all registry and claims cohorts, with male predominance and sex differences in anemia thresholds discussed in prognostic literature.","sources":"EHR demographics; claims enrollment files","coverage":"config_expressible"},{"tumour":"mcrc","name":"SEX","sketch":"Patient sex as recorded in the medical record; a standard stratification and adjustment covariate, and one of the axes along which colorectal incidence trends differ.","sources":"Structured EHR demographics; registry records.","coverage":"config_expressible"}],"engine":{"config":"clinical.passthrough","verification":"unit / stage"}},{"name":"RACE_ETHNICITY","category":"demographics","definition":"Race and ethnicity as documented in the source, typically collapsed to a small category set with an explicit missing/unknown level — EHR-derived databases show greater incompleteness than registries, so the unknown level is part of the definition, not a footnote.","slots":{"collapse":{"description":"the category collapse scheme and how missing/unknown is carried","examples":{}}},"citations":["Ma X et al. 2020, medRxiv, DOI 10.1101/2020.03.16.20037143"],"uses":[{"tumour":"ovarian","name":"RACE_ETH","sketch":"Race and ethnicity as recorded in the EHR, commonly collapsed to White/Black/Asian/Other/Unknown; used for generalizability and disparities analyses.","sources":"Structured EHR demographic fields; registry fields in SEER-Medicare","coverage":"engine_family"},{"tumour":"endometrial","name":"RACE_ETH","sketch":"Race/ethnicity as recorded in the EHR; a key variable given documented outcome disparities (notably worse outcomes among Black patients, enriched for serous/p53-abnormal histology).","sources":"Structured EHR demographic fields","coverage":"engine_family"},{"tumour":"prostate","name":"RACE_ETH","sketch":"Race/ethnicity from EHR fields, with specific attention to representation and outcomes of Black men in RWD versus trials.","sources":"Structured EHR demographic fields","coverage":"engine_family"},{"tumour":"nsclc","name":"RACE_ETHNICITY","sketch":"Race and ethnicity as documented in the EHR, typically with a substantial missing/unknown category acknowledged relative to registry data.","sources":"Structured EHR demographic fields; registry race/ethnicity in SEER linkages.","coverage":"engine_family"},{"tumour":"sclc","name":"RACE_ETHNICITY","sketch":"Race and ethnicity as documented in the EHR, with known higher missingness in EHR-derived data than in registries.","sources":"EHR demographics; SEER registry race/ethnicity fields for benchmarking.","coverage":"engine_family"},{"tumour":"dlbcl","name":"RACE_ETHNICITY","sketch":"Race and ethnicity as documented in the EHR, with missingness acknowledged; used for representativeness and disparities analyses.","sources":"Structured EHR demographic fields in COTA/Flatiron-style databases.","coverage":"engine_family"},{"tumour":"cll","name":"RACE_ETHNICITY","sketch":"Race/ethnicity as documented; treatment-pattern disparities are an explicit analysis axis in US registry literature.","sources":"EHR demographics; registry fields.","coverage":"engine_family"},{"tumour":"gist","name":"RACE_ETHNICITY","sketch":"Race/ethnicity; SEER analyses report higher GIST incidence among Black patients, making this a standard population descriptor.","sources":"Registry fields; EHR demographics.","coverage":"engine_family"},{"tumour":"hnscc","name":"RACE_ETHNICITY","sketch":"Race and ethnicity categories as recorded; EHR-derived databases show greater incompleteness than registries, so a missing/unknown level is routinely defined.","sources":"Structured EHR demographics; SEER registry race/ethnicity fields.","coverage":"engine_family"},{"tumour":"multiple_myeloma","name":"RACE_ETHNICITY","sketch":"Race and ethnicity categories including a defined missing/unknown level; relevant to known disparities in myeloma incidence, treatment access, and trial representation.","sources":"Structured EHR demographics; registry fields in SEER-Medicare.","coverage":"engine_family"},{"tumour":"myelofibrosis","name":"RACE_ETHNICITY","sketch":"Race and ethnicity as recorded in source data; reported descriptively in US population-based and Medicare MF cohorts.","sources":"EHR structured demographics; SEER registry race fields; Medicare enrollment data","coverage":"engine_family"},{"tumour":"mds","name":"RACE_ETHNICITY","sketch":"Race/ethnicity as recorded; standard covariate in SEER-Medicare and US registry MDS analyses.","sources":"SEER race fields; EHR structured demographics","coverage":"engine_family"},{"tumour":"mcrc","name":"RACE_ETHNICITY","sketch":"Race and ethnicity as documented in the EHR, typically with a substantial unknown category relative to registry data; colorectal incidence and mortality differ materially across groups, so the unknown fraction is reported rather than dropped.","sources":"Structured EHR demographic fields; registry race/ethnicity in SEER linkages.","coverage":"engine_family"}],"engine":{"config":"demographics.race_map, demographics.ethnicity_map","verification":"component / component"}},{"name":"PRACTICE_SETTING","category":"demographics","definition":"Community versus academic treatment setting of the contributing site (and often US region); EHR-derived oncology networks are predominantly community-based, which frames generalisability and conditions capture of referral-centre therapies (transplant, cellular therapy).","slots":{},"citations":["Presley CJ et al. 2018, JAMA, PMID 30088010"],"uses":[{"tumour":"ovarian","name":"PRACTICE_TYPE","sketch":"Treating practice setting (community vs academic) and US geographic region; a standard descriptor of EHR-derived oncology cohorts.","sources":"Practice metadata in EHR-derived network databases","coverage":"engine_family"},{"tumour":"endometrial","name":"PRACTICE_TYPE","sketch":"Community vs academic treating site and US region of the treating practice.","sources":"Practice metadata in EHR-derived network databases","coverage":"engine_family"},{"tumour":"prostate","name":"PRACTICE_TYPE","sketch":"Community vs academic treating site and geographic region; most Flatiron prostate patients are community-treated.","sources":"Practice metadata in EHR-derived network databases","coverage":"engine_family"},{"tumour":"nsclc","name":"PRACTICE_SETTING","sketch":"Community versus academic treatment setting of the contributing site; EHR-derived oncology networks are predominantly community-based, which frames generalizability.","sources":"Site metadata in EHR-derived networks (Flatiron, US Oncology Network).","coverage":"engine_family"},{"tumour":"sclc","name":"PRACTICE_TYPE","sketch":"Community versus academic treatment setting of the contributing practice; used to characterize generalizability of EHR-derived cohorts.","sources":"Network metadata in Flatiron/ConcertAI-type databases.","coverage":"engine_family"},{"tumour":"dlbcl","name":"PRACTICE_SETTING","sketch":"Community versus academic treatment setting of the contributing site; DLBCL RWD cohorts mix academic medical centers and community practices, which shifts access to ASCT/CAR-T.","sources":"Site metadata in EHR-derived networks.","coverage":"engine_family"},{"tumour":"cll","name":"PRACTICE_SETTING","sketch":"Community versus academic site of care; informCLL enrolled ~96% from community practices, where prognostic-testing gaps concentrate.","sources":"Registry site metadata; EHR network metadata.","coverage":"engine_family"},{"tumour":"multiple_myeloma","name":"PRACTICE_SETTING","sketch":"Community versus academic treatment setting; US EHR-derived MM cohorts are predominantly community-treated, which conditions ASCT and cellular-therapy capture.","sources":"Practice metadata in EHR-derived databases.","coverage":"engine_family"},{"tumour":"mcrc","name":"PRACTICE_SETTING","sketch":"Community versus academic treatment setting of the contributing site. It frames generalisability and, for mCRC specifically, tracks with how completely guideline-recommended biomarker testing is performed.","sources":"Site metadata in EHR-derived oncology networks.","coverage":"engine_family"}],"engine":{"config":"demographics.practice_map","verification":"component / component"}},{"name":"INSURANCE_PAYER","category":"demographics","definition":"Payer/insurance category at or near index (Medicare, Medicaid, commercial, uninsured/unknown); central in claims-linked resources such as SEER-Medicare.","slots":{"window":{"description":"the window around index in which payer status is read","examples":{}}},"citations":["Warren JL et al. 2002, Med Care, PMID 12187163"],"uses":[{"tumour":"ovarian","name":"INSURANCE","sketch":"Payer/insurance category at or near index (Medicare, Medicaid, commercial, uninsured/unknown); central in claims-linked resources such as SEER-Medicare.","sources":"Structured payer fields in EHR; enrollment files in SEER-Medicare","coverage":"config_expressible"},{"tumour":"endometrial","name":"INSURANCE","sketch":"Payer category at index; central to claims-linked analyses (SEER-Medicare) of elderly endometrial cancer populations.","sources":"Structured payer fields; Medicare enrollment files","coverage":"config_expressible"},{"tumour":"prostate","name":"INSURANCE","sketch":"Payer category at index; SEER-Medicare remains a standard source for elderly metastatic prostate cancer treatment-pattern and outcome studies.","sources":"Structured payer fields; Medicare enrollment files","coverage":"config_expressible"},{"tumour":"mcrc","name":"INSURANCE_PAYER","sketch":"Primary payer category at or near index (commercial, Medicare, Medicaid, other, unknown), usually taken from the coverage record closest to the index within a stated window.","sources":"Structured covera ion":"ECOG performance status closest to index within a defined window; frequently missing in RWD and handled with an explicit unknown category. A core prognostic covariate and treatment-eligibility proxy.","slots":{"window":{"description":"the lookback/lookahead window around index (e.g. -30/+7 days) and the tie-break for multiple values","examples":{}}},"citations":["Oken MM et al. 1982, Am J Clin Oncol, PMID 7165009","Stewart M et al. 2019, JCO Clin Cancer Inform, PMID 31335166"],"uses":[{"tumour":"ovarian","name":"ECOG","sketch":"ECOG performance status (0-4) closest to index within a defined window (e.g., -30/+7 days); standard baseline covariate and effect modifier.","sources":"Structured ECOG fields + abstraction from notes","coverage":"engine_family"},{"tumour":"endometrial","name":"ECOG","sketch":"ECOG performance status closest to index within a defined window; baseline covariate for comparative analyses.","sources":"Structured ECOG fields + note abstraction","coverage":"engine_family"},{"tumour":"prostate","name":"ECOG","sketch":"ECOG performance status closest to index; prognostic factor in the Halabi mCRPC model and standard adjustment covariate.","sources":"Structured ECOG fields + note abstraction","coverage":"engine_family"},{"tumour":"nsclc","name":"ECOG_PS","sketch":"ECOG performance status closest to (typically on/before) the index or line-start date, commonly windowed (e.g., within 30-60 days); frequently missing in RWD and handled with an unknown category.","sources":"Structured ECOG fields and abstracted clinician notes in EHR-derived data.","coverage":"engine_family"},{"tumour":"sclc","name":"ECOG_PS_AT_INDEX","sketch":"ECOG performance status (0-4) closest to index within a defined window; trial populations were ECOG 0-1, so real-world PS distribution is a key transportability variable.","sources":"Structured PS fields and abstracted notes in EHR.","coverage":"engine_family"},{"tumour":"dlbcl","name":"ECOG_PS","sketch":"ECOG performance status at or near diagnosis/line start; an IPI component (2 or higher counts as a risk factor) and a common eligibility axis for aggressive therapies.","sources":"Structured ECOG fields and abstracted notes in EHR-derived data.","coverage":"engine_family"},{"tumour":"cll","name":"ECOG_PS_AT_INDEX","sketch":"ECOG performance status closest to index; SEQUOIA and most frontline trials required ECOG 0-2, making PS a transportability covariate.","sources":"Structured PS fields; abstracted notes.","coverage":"engine_family"},{"tumour":"gist","name":"ECOG_PS_AT_INDEX","sketch":"ECOG performance status closest to index; an eligibility bound in the pivotal TKI trials and a routine real-world covariate.","sources":"Structured PS fields; abstracted notes.","coverage":"engine_family"},{"tumour":"hnscc","name":"ECOG_PS","sketch":"Eastern Cooperative Oncology Group performance status (0-5) closest to index, a core prognostic covariate and treatment-eligibility proxy.","sources":"Structured or abstracted performance status in EHR-derived data, often with high missingness; unavailable in claims.","coverage":"engine_family"},{"tumour":"multiple_myeloma","name":"ECOG_PS","sketch":"ECOG performance status (0-5) closest to each index date; prognostic covariate and fitness proxy.","sources":"Structured or abstracted performance status in EHR-derived data; prospectively collected in LocoMMotion.","coverage":"engine_family"},{"tumour":"mcrc","name":"ECOG_PS","sketch":"ECOG performance status closest to (typically on or before) the index or line start, windowed and with an explicit unknown category. It is also an eligibility axis: the cited refractory-setting trial enrolled ECOG 0-1 only, so real-world ECOG 2+ patients sit o","sources":"Structured ECOG fields and abstracted clinician notes in EHR-derived data.","coverage":"engine_family"}],"engine":{"config":"clinical.baseline_ecog","verification":"unit / stage"}},{"name":"COMORBIDITY_INDEX","category":"comorbidity_labs","definition":"Baseline r a lookback window before index from diagnosis codes; the standard confounder in claims-linked oncology studies and the covariate that separates fitness for a triplet from fitness f","sources":"ICD diagnosis codes in Medicare claims (SEER-Medicare) or structured EHR problem lists.","coverage":"config_expressible"}],"engine":{"config":"clinical.comorbidity_index","verification":"component / component"}},{"name":"LINE_OF_THERAPY","category":"treatment","definition":"The ordered systemic-therapy line table derived by rules over drug episodes — which agents start a new line, the combination window, the gap that separates lines, and how maintenance is attributed. Every line-anchored variable (line number, line start/stop, per-line endpoints) reads this table, so the rules are the parameter that matters.","slots":{"line_rules":{"description":"qualifying agents, combination window, gap rule, maintenance attribution, and (heme) whether the IMWG uniform-reporting rules apply","examples":{"ovarian":"maintenance agents appended to the induction line rather than counted as a new line","multiple_myeloma":"lines counted per IMWG uniform-reporting rules"}}},"citations":["Stewart M et al. 2019, JCO Clin Cancer Inform, PMID 31335166","Rajkumar SV et al. 2011, Blood, PMID 21292775"],"uses":[{"tumour":"ovarian","name":"LOT_NUMBER","sketch":"Ordinal line number of each regimen and count of prior platinum lines; used to define 2L+/3L+ platinum-sensitive populations.","sources":"Derived line-of-therapy table","coverage":"upstream_required"},{"tumour":"endometrial","name":"LOT_NUMBER","sketch":"Ordinal line number in the advanced/recurrent setting and attrition across lines (roughly half of first-line patients ever receive second-line therapy in US RWD).","sources":"Derived line-of-therapy table","coverage":"upstream_required"},{"tumour":"prostate","name":"LINE_OF_THERAPY","sketch":"Derived treatment lines over life-prolonging prostate agents (NHA, taxane, radium-223, sipuleucel-T, PARP "Overall survival from index to death, using a composite real-world death date (structured EHR + Social Security Death Index + obituary data) validated against the National Death Index; censoring at last structured activity.","sources":"Composite mortality variable in EHR-derived databases","coverage":"engine_family"},{"tumour":"endometrial","name":"OS","sketch":"Overall survival from index (commonly first-line start) to composite real-world death date validated against the NDI; censoring at last structured activity.","sources":"Composite mortality variable (structured EHR + SSDI + obituaries)","coverage":"engine_family"},{"tumour":"prostate","name":"OS","sketch":"Overall survival from index (metastatic diagnosis, CRPC date, or line start) to composite real-world death date validated against the NDI; censoring at last structured activity.","sources":"Composite mortality variable (structured EHR + SSDI + obituaries)","coverage":"engine_family"},{"tumour":"nsclc","name":"OS","sketch":"Overall survival from advanced diagnosis date to death from any cause, censoring at last confirmed activity/structured visit; the reference endpoint for aNSCLC RWD studies.","sources":"Composite mortality variable plus last-activity censoring dates in EHR-derived databases.","coverage":"engine_family"},{"tumour":"nsclc","name":"OS_LINE_START","sketch":"Overall survival measured from start of a specified line of therapy (commonly first-line or the IO-containing line) to death, censoring at last activity; the treated-cohort companion to OS from diagnosis.","sources":"Line-start dates from treatment algorithms plus the composite mortality variable in EHR-derived data.","coverage":"engine_family"},{"tumour":"sclc","name":"REAL_WORLD_OS","sketch":"Overall survival from index using a composite mortality variable (EHR structured data, obituary/SSDI, abstracted notes) benchmarked against the National Death Index.","sources":"Composite mortality endpoint in Flatiron-type databases; NDI linkage in ortality (composite of EHR, obituary, SSDI-type sources); Medicare vital status; registry follow-up","coverage":"engine_family"},{"tumour":"mds","name":"OVERALL_SURVIVAL","sketch":"Time from diagnosis/index to death from any cause; primary endpoint of prognostic model development (IPSS/IPSS-R/IPSS-M) and of real-world HMA comparative-effectiveness studies.","sources":"EHR-linked composite mortality; Medicare vital status files; registry follow-up","coverage":"engine_family"},{"tumour":"mcrc","name":"OVERALL_SURVIVAL","sketch":"Overall survival from the metastatic diagnosis to death from any cause, censoring at last confirmed activity; the reference endpoint for mCRC real-world studies, with US EHR-derived medians reported under two years from first-line start.","sources":"Composite mortality variable plus last-activity censoring dates in EHR-derived databases.","coverage":"engine_family"},{"tumour":"mcrc","name":"OS_LINE_START","sketch":"Overall survival re-anchored at the start of a given line — the same event with a different clock. It is reported per line because the first- and second-line medians differ substantially and a single diagnosis-anchored median hides that.","sources":"Line start dates from the line-of-therapy table plus the composite mortality variable.","coverage":"engine_family"}],"engine":{"config":"outcomes.overall_survival, outcomes.min_followup_days","verification":"unit / stage"}},{"name":"RWPFS","category":"outcomes","definition":"Real-world progression-free survival — index to the first clinician-anchored, abstractor-confirmed progression event or death, censoring at the last adequate assessment. Strict trial RECIST replication is infeasible in EHR data; the clinician-anchored abstraction is the validated approach.","slots":{"index_anchor":{"description":"which index the endpoint runs from (usually line start)","examples":{}},"event_definition":{"description":"what counts as a progression event in this tumour (radiology-anchored, clinician-an ts in EHR-derived data.","coverage":"engine_family"},{"tumour":"cll","name":"RW_PFS","sketch":"Progression or death from line start, with progression per iwCLL criteria as documented by the treating clinician; redistribution lymphocytosis excluded as progression.","sources":"Chart-abstracted progression events; registry follow-up forms.","coverage":"engine_family"},{"tumour":"gist","name":"RW_PFS_TTP","sketch":"Real-world progression-free survival / time to progression on each TKI line, using clinician-anchored progression events given the impracticality of strict RECIST re-read in routine care.","sources":"Chart-abstracted progression assessments; radiology report abstraction.","coverage":"engine_family"},{"tumour":"multiple_myeloma","name":"RW_PFS","sketch":"Real-world progression-free survival from line index to first documented progression (laboratory or clinician-anchored) or death, censored at last activity; the standard per-line effectiveness endpoint in Flatiron MM analyses.","sources":"Abstracted progression events plus composite mortality in EHR-derived data; methodology adapted from clinician-anchored real-world progression abstraction.","coverage":"engine_family"},{"tumour":"mcrc","name":"RWPFS","sketch":"Real-world progression-free survival from index (usually line start) to the first real-world progression event or death, censoring at last adequate assessment; the standard intermediate endpoint where trial-grade response assessment is unavailable.","sources":"Abstracted real-world progression events plus the composite mortality variable.","coverage":"engine_family"}],"engine":{"config":"outcomes.progression","verification":"component / component"}},{"name":"RWTTD","category":"outcomes","definition":"Real-world time to treatment discontinuation — line/drug start to last administration or discontinuation, with death as an event and censoring for patients still on therapy; the pragmatic endpoint when progression abstraction is unavailable.","slots":{"discontinuation_rule":{"description":"the gap rule that reads as discontinuation, and whether death is an event","examples":{}}},"citations":["Stewart M et al. 2019, JCO Clin Cancer Inform, PMID 31335166","Blumenthal GM et al. 2019, Ann Oncol, DOI 10.1093/annonc/mdz060"],"uses":[{"tumour":"ovarian","name":"RWTTD","sketch":"Real-world time to treatment discontinuation: start of a line to last administration/last dose of that line, with death as an event; pragmatic surrogate when progression abstraction is unavailable.","sources":"Structured drug administration/order dates + composite death date","coverage":"engine_family"},{"tumour":"endometrial","name":"RWTTD","sketch":"Time from line start to treatment discontinuation or death; particularly used for lenvatinib-pembrolizumab and IO maintenance where discontinuation reflects toxicity or progression.","sources":"Structured drug episode dates + composite death date","coverage":"engine_family"},{"tumour":"prostate","name":"RWTTD","sketch":"Time from line start to discontinuation of that line or death; pragmatic endpoint for oral NHA persistence in EHR-derived data.","sources":"Structured/abstracted drug episode dates + composite death date","coverage":"engine_family"},{"tumour":"nsclc","name":"RWTTD","sketch":"Real-world time to treatment discontinuation, from line/drug start to last administration or discontinuation (death treated as an event), censoring for patients still on therapy; a pragmatic endpoint correlated with PFS.","sources":"Structured treatment episode dates in EHR-derived data; validated conceptually against trial TTD by FDA pooled analyses.","coverage":"engine_family"},{"tumour":"myelofibrosis","name":"TIME_TO_DISCONTINUATION","sketch":"Time from JAK-inhibitor start to permanent discontinuation (real-world persistence endpoint); discontinuation marks a poor-prognosis inflection (median OS ~13-14 months after ruxolitinib stop).","sources":"Medication start/stop dates in EHR-derived data; gaps in pharmacy claims","coverage":"engine_family"},{"tumour":"mcrc","name":"RWTTD","sketch":"Real-world time to treatment discontinuation, from line or drug start to the last administration or a discontinuation event, with death treated as an event and ongoing therapy censored. In mCRC the planned maintenance de-escalation makes the discontinuation ru","sources":"Structured treatment episode dates in EHR-derived data.","coverage":"engine_family"}],"engine":{"config":"outcomes.line_outcomes, outcomes.visit_recency_days","verification":"component / component"}},{"name":"TTNT","category":"outcomes","definition":"Time to next treatment — start of the index line to initiation of the next systemic line or death, censoring otherwise; a durability proxy robust to imaging/lab capture gaps.","slots":{"event_definition":{"description":"what qualifies as the \"next\" treatment (any systemic line, life-prolonging agents only, etc.)","examples":{}}},"citations":["Stewart M et al. 2019, JCO Clin Cancer Inform, PMID 31335166"],"uses":[{"tumour":"ovarian","name":"TTNT","sketch":"Time to next treatment: start of index line to start of the next systemic line or death; in ovarian RWD often interpreted as a proxy for progression-driven treatment change.","sources":"Derived line-of-therapy table + composite death date","coverage":"engine_family"},{"tumour":"endometrial","name":"TTNT","sketch":"Time from start of index line to start of next systemic line or death; standard treatment-change proxy endpoint in EHR-derived endometrial studies.","sources":"Derived line-of-therapy table + composite death date","coverage":"engine_family"},{"tumour":"prostate","name":"TTNT","sketch":"Time from start of index line to initiation of next life-prolonging therapy or death; standard sequencing endpoint in mCRPC RWD.","sources":"Derived line-of-therapy table + composite death date","coverage":"engine_family"},{"tumour":"nsclc","name":"TTNT","sketch":"Time to next treatment, from start of the index line to initiation of the subsequent systemic line or death, censoring otherwise; a proxy for durable disease control in RWD.","sources":"Line-of-therapy sequences from structured EHR or claims data.","coverage":"engine_family"},{"tumour":"dlbcl","name":"TTNT","sketch":"Time to next treatment, from start of the index line to initiation of the next systemic line or death, censoring otherwise; used as a pragmatic durability measure across DLBCL lines in RWD.","sources":"Line-of-therapy sequences from structured EHR data.","coverage":"engine_family"},{"tumour":"cll","name":"TIME_TO_NEXT_TREATMENT","sketch":"Time from start of a line to start of the subsequent line or death; the pragmatic proxy for durable benefit in EHR/registry data where iwCLL response assessment is incomplete.","sources":"Derived from line-of-therapy tables.","coverage":"engine_family"},{"tumour":"gist","name":"TIME_TO_NEXT_TREATMENT","sketch":"Time from start of a TKI line to initiation of the next line or death; pragmatic durability proxy when imaging-based progression is inconsistently documented.","sources":"Derived from line-of-therapy tables.","coverage":"engine_family"},{"tumour":"hnscc","name":"TIME_TO_NEXT_TREATMENT","sketch":"Time from index treatment initiation to initiation of the next systemic therapy or death, used as a pragmatic progression proxy in EHR-derived LA-HNSCC studies.","sources":"Derived from structured therapy episodes and composite mortality.","coverage":"engine_family"},{"tumour":"multiple_myeloma","name":"TIME_TO_NEXT_TREATMENT","sketch":"Time from start of a line to start of the next line of therapy or death, a progression proxy robust to imaging/lab capture gaps in EHR-derived data.","sources":"Derived from line-of-therapy tables and composite mortality.","coverage":"engine_family"},{"tumour":"mcrc","name":"TTNT","sketch":"Time to next treatment, from the start of the index line to initiation of the subsequent systemic line or death, censoring otherwise; a proxy for durable disease control that does not depend on abstracted progression.","sources":"Line-of-therapy sequences derived from structured EHR or claims data.","coverage":"engine_family"}],"engine":{"config":"outcomes.line_outcomes","verification":"component / component"}},{"name":"RW_RESPONSE","category":"outcomes","definition":"Real-world response — the clinician's documented interpretation of response assessments (imaging, and in heme the lab-defined criteria), abstracted with assessment dates. Tracks trial ORR direction but is not interchangeable with it.","slots":{"assessment_basis":{"description":"what the response call is anchored on in this tumour (imaging interpretation, Lugano PET, IMWG lab criteria, GCIG CA-125)","examples":{}}},"citations":["Ma X et al. 2021, Adv Ther, DOI 10.1007/s12325-021-01659-0"],"uses":[{"tumour":"ovarian","name":"RWRESP","sketch":"Real-world response: clinician-anchored assessment of tumor burden change abstracted from the chart (RECIST-style categories rarely reproducible in routine care; clinician/radiology-anchored abstraction is the validated approach).","sources":"Abstracted clinician/radiology response assessments","coverage":"config_expressible"},{"tumour":"endometrial","name":"RWRESP","sketch":"Real-world response: clinician-anchored best response abstracted from imaging/clinician documentation (RECIST-style quantitation generally not reproducible in routine EHR data).","sources":"Abstracted clinician/radiology response assessments","coverage":"config_expressible"},{"tumour":"nsclc","name":"RW_RESPONSE","sketch":"Real-world response capturing the clinician's interpretation of radiographic assessments (complete/partial response, stable, progression) at assessment dates; real-world response rates track RECIST ORR direction but are not interchangeable.","sources":"Chart abstraction of clinician response assessments and imaging interpretations in EHR-derived databases.","coverage":"config_expressible"},{"tumour":"dlbcl","name":"RW_RESPONSE","sketch":"Real-world response (including complete response rate) based on clinician-documented assessment of PET/CT per Lugano-style criteria at the end of induction or per line; abstracted rather than independently re-read.","sources":"Chart abstraction of clinician response assessments and PET/CT reports in EHR-derived databases.","coverage":"engine_gap"},{"tumour":"multiple_myeloma","name":"IMWG_RESPONSE","sketch":"Best confirmed response per line per IMWG consensus categories (sCR, CR, VGPR, PR, MR, SD, PD), with real-world response typically derived from serial M-protein and free light chain laboratory values rather than adjudicated review.","sources":"Serial SPEP/FLC labs and abstracted clinician response assessments in EHR-derived data; investigator-assessed IMWG response in prospective RWD such as LocoMMoti","coverage":"engine_gap"},{"tumour":"mcrc","name":"RW_RESPONSE","sketch":"Real-world response capturing the clinician's interpretation of radiographic assessment (complete or partial response, stable disease, progression) at assessment dates. It tracks the direction of trial response rates but is not equivalent to them, which matter","sources":"Chart abstraction of clinician response assessments and imaging interpretations in EHR-derived databases.","coverage":"config_expressible"}],"engine":{"config":"clinical.response","verification":"unit / stage"}},{"name":"REGION","category":"demographics","definition":"US geographic region of the treating practice, mapped from the practice state; standard cohort descriptor beside practice setting.","slots":{"region_map":{"description":"the state-to-region crosswalk (labels, codes, and which states each region holds)","examples":{}}},"citations":["in-house: prostate 202606 programme specification / functional contract","in-house: oc 202606 programme specification (sanitized extraction)"],"uses":[{"tumour":"ovarian","name":"REGION","sketch":"US region of the treating practice from the practice state.","sources":"Structured practice
