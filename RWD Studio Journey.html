  <section class="stack" aria-labelledby="h-prev" style="gap:10px"><div class="row" style="justify-content:space-between;align-items:baseline"><h2 id="h-prev">Dataset preview</h2><span class="warnchip">Illustrative preview rows</span></div>
    <div class="tablewrap" tabindex="0" aria-label="Dataset preview, illustrative rows" id="preview"><table class="data"><thead><tr>${PREVIEW.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${PREVIEW.rows.map(r => `<tr>${r.map(v => `<td class="${typeof v === "number" ? "num" : ""}">${v === null ? '<span class="muted">null</span>' : esc(typeof v === "number" && !Number.isInteger(v) ? v.toFixed(2) : v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="small muted">8 of 18 rows, 9 of 26 columns. Values are synthetic and made up for the preview.</p></section>
  <section class="card stack" aria-labelledby="h-rcpt" id="receipt"><div class="row" style="justify-content:space-between"><h2 id="h-rcpt">Build receipt</h2><span class="small muted">Real identifiers from the recorded build</span></div>
    <dl class="kv" style="margin:0">
      <dt>build id</dt><dd><span class="hash" title="${RECEIPT.build}">${RECEIPT.build}</span></dd>
      <dt>Parquet SHA-256</dt><dd><span class="hash" title="${RECEIPT.parquet}" id="rc-parquet">${short(RECEIPT.parquet)}</span></dd>
      <dt>manifest SHA-256</dt><dd><span class="hash" title="${RECEIPT.manifest}" id="rc-manifest">${short(RECEIPT.manifest)}</span></dd>
      <dt>run time</dt><dd>173.8 s, queue to completion</dd>
    </dl>
    <details class="inline" id="rc-full"><summary class="small">Show full hashes</summary><dl class="kv"><dt>Parquet</dt><dd>${RECEIPT.parquet}</dd><dt>manifest</dt><dd>${RECEIPT.manifest}</dd></dl></details>
    <p class="small muted">The same receipt identifies this exact dataset in any later check.</p></section>`;
  return `${head("build", "Run the engine on the mapped sources and check the output.")}
  <section class="card stack" aria-labelledby="h-build"><div class="row" style="justify-content:space-between;align-items:baseline"><h2 id="h-build">Build</h2><span class="small muted">Recorded run: 173.8 s from queue to completion</span></div>
    <div id="build-stages">${stagesHtml()}</div>${status}</section>
  ${results}
  ${foot("build")}`;
}

/* ---------- RELEASE ---------- */
function V_release(){
  const acc = acceptedCount(), q = qCounts(), built = S.build === "done", src = typesFixed();
  const P = (k, t) => `<span class="pill ${k}">${t}</span>`;
  const items = [
    ["defs", "Definitions reviewed", `<span class="mono">${acc}</span> of <span class="mono">${TOTAL_ROWS}</span> accepted, rest open`, acc === TOTAL_ROWS ? P("ok", "Complete") : P("amber", "In progress"), acc === TOTAL_ROWS],
    ["qs", "Questions answered", `<span class="mono">${q.a}</span> of <span class="mono">${q.t}</span> answered in this walkthrough`, q.a === q.t ? P("ok", "Complete") : q.a ? P("amber", "In progress") : P("grey", "Not started"), q.a === q.t],
    ["src", "Sources verified", src ? "32 of 32 declarations verified, types corrected" : "2 type corrections to confirm", src ? P("ok", "Complete") : P("amber", "In progress"), src],
    ["build", "Build reproducible", built ? `Receipt <span class="mono">${RECEIPT.build.slice(0, 12)}…</span>` : "Run the build to get a receipt", built ? P("ok", "Complete") : P("grey", "Not started"), built],
    ["dp", "Python and R agree", "Engine proven equal on prostate; oral cavity comparison not run yet", P("amber", "In progress"), false],
    ["appr", "Named approval", "Science and data owner sign the version", P("grey", "Not started"), false]
  ];
  const ready = items.slice(0, 5).every(i => i[4]);
  const open = CARDS.filter(c => cardStatus(c) !== "accepted").length + (TOTAL_ROWS - OTHER_ACCEPTED - CARDS.length);
  return `${head("release", "Everything that must be true before a named person signs.")}
  <section class="card" aria-label="Release checklist"><ul class="checklist">
    ${items.map(i => `<li id="chk-${i[0]}"><div><div style="font-weight:500">${i[1]}</div><div class="small muted">${i[2]}</div></div>${i[3]}</li>`).join("")}
  </ul></section>
  <div class="grid2">
    <section class="card stack" aria-labelledby="h-remain" style="gap:10px"><h2 id="h-remain">What remains before release</h2>
      <ul class="remain"><li><span class="mono">7</span> review attention items</li><li>No authenticated clinical approval yet</li><li><span class="mono">${open}</span> definitions still open in this walkthrough</li></ul></section>
    <section class="card stack" aria-labelledby="h-sign" style="gap:10px"><h2 id="h-sign">Sign the release</h2>
      <div><button class="btn go" id="sign-release" disabled aria-describedby="sign-help">Sign release 202609.1</button></div>
      <p class="small muted" id="sign-help">${S.role === "approver" ? (ready ? "Available after named approval is set up for this product." : "Available when every item above is complete. " + items.filter(i => !i[4]).length + " items are still open.") : "Signing is an Approver action. Switch to Approver to see your view."}</p>
      ${S.role !== "approver" ? `<div><button class="linkbtn" id="sw-sign" data-act="role" data-r="approver">Switch to Approver</button></div>` : ""}</section>
  </div>
  <p class="note">Governance runs in the background at each step and blocks only here.</p>
  ${foot("release", `<a href="#overview" id="finish" class="btn primary">Back to the overview</a>`)}`;
}

const VIEWS = { library: V_library, overview: V_overview, start: V_start, spec: V_spec, draft: V_draft, sources: V_sources, build: V_build, release: V_release };

/* ---------- simulated runs ---------- */
function startDraft(){
  S.draft = "running"; S.draftStep = 0; render();
  if (reduced()) { finishDraft(); return; }
  clearInterval(timer);
  timer = setInterval(() => {
    S.draftStep++;
    if (S.draftStep >= RUNLOG.length) { finishDraft(); return; }
    const host = $("#draft-run"); if (host && route() === "draft") host.innerHTML = runlogHtml();
  }, 500);
}
function finishDraft(){ clearInterval(timer); S.draft = "done"; S.draftStep = RUNLOG.length; if (route() === "draft") { render(); const h = $("#h-sum"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } } toast("Drafts ready · 7 shown for review"); }
function startBuild(){
  S.build = "running"; S.buildStep = 0; render();
  if (reduced()) { finishBuild(); return; }
  clearInterval(timer);
  timer = setInterval(() => {
    S.buildStep++;
    if (S.buildStep >= STAGES.length) { finishBuild(); return; }
    if (route() === "build") { const h = $("#build-stages"); if (h) h.innerHTML = stagesHtml(); const s = $("#build-status"); if (s) s.textContent = "Building · " + STAGES[S.buildStep]; }
  }, 900);
}
function finishBuild(){ clearInterval(timer); S.build = "done"; S.buildStep = STAGES.length; if (route() === "build") { render(); const h = $("#h-res"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } } toast("Build complete · 18 rows × 26 columns"); }

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "closedlg") { if (e.target === el) closeDialog(); return; }
  e.preventDefault();
  if (el.disabled) return;
  if (act === "nav") go(el.dataset.to);
  else if (act === "continue") { const k = el.dataset.from, i = stepIndex(k); S.done[k] = true; if (k === "start") toast("Product created · oral cavity cancer, spec 202609"); go(STEPS[i + 1].k); }
  else if (act === "role") { S.role = el.dataset.r; const id = "role-" + S.role; render(); toast("Viewing as " + ROLES[S.role]); if (!el.closest(".seg")) { const b = document.getElementById(id); if (b) b.focus(); } }
  else if (act === "reset") { clearInterval(timer); seed(); render(); toast("Prototype reset to its starting state"); }
  else if (act === "replace") toast("Upload is simulated in this prototype");
  else if (act === "sheet") { S.sheet = el.dataset.s; render(); }
  else if (act === "draftai") startDraft();
  else if (act === "draftskip") finishDraft();
  else if (act === "answer") { const c = el.dataset.c, k = +el.dataset.k, j = +el.dataset.j; S.ans[c][k] = CBY[c].qs[k].c[j]; const before = cardStatus(CBY[c]); render(); toast("Answer recorded" + (before === "drafted" ? " · " + (CBY[c].v || CBY[c].label) + " can now be accepted" : "")); const a = document.getElementById("acc-" + c.replace(":", "-")); if (a && !a.disabled) a.focus(); }
  else if (act === "unanswer") { const c = el.dataset.c, k = +el.dataset.k; delete S.ans[c][k]; render(); }
  else if (act === "accept") { const c = el.dataset.c; S.cst[c] = "accepted"; render(); toast("Accepted " + (CBY[c].v || CBY[c].label) + " · " + acceptedCount() + " of 22 accepted"); }
  else if (act === "edit") openDialog("edit", el.dataset.c);
  else if (act === "ask") openDialog("ask", el.dataset.c);
  else if (act === "savedlg") { const t = ($("#dlg-text").value || "").trim(), c = dlgFor; if (!t) { $("#dlg-text").focus(); return; } if (dlgMode === "edit") S.edits[c] = t; else S.mine[c].push(t); const mode = dlgMode; closeDialog(); render(); toast(mode === "edit" ? "Edit saved · the AI original is kept" : "Question sent"); }
  else if (act === "fix") { S.fixed[el.dataset.f] = true; render(); toast("Declared string type used for " + el.dataset.f); const n = document.querySelector("[data-act=fix]:not([disabled])"); if (n) n.focus(); }
  else if (act === "build") startBuild();
  else if (act === "libcat") { S.lib.cat = el.dataset.k; render(); }
  else if (act === "libsel") { S.lib.sel = el.dataset.m; render(); if (window.matchMedia("(max-width:1100px)").matches) { const pnl = $("#lib-panel"); if (pnl) pnl.scrollIntoView({ block: "start", behavior: reduced() ? "auto" : "smooth" }); } const h = $("#lib-title"); if (h && window.matchMedia("(max-width:1100px)").matches) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }
  else if (act === "libuse") toast("Added as a draft starting point for Oral cavity. Parameters stay blank until you choose them.");
  else if (act === "compare") { S.lib.sel = el.dataset.m; S.lib.q = ""; S.lib.cat = ""; go("library"); }
  else if (act === "applylib") { S.sugg[el.dataset.c] = true; render(); toast("Suggestion added from the library. Confirm it to apply."); const sg = document.getElementById("sugg-" + el.dataset.c.replace(":", "-")); if (sg) sg.focus(); }
  else if (act === "confirmsugg") { const c = el.dataset.c; S.ans[c][0] = ECOG_SUGGEST; delete S.sugg[c]; render(); toast("Window confirmed: " + ECOG_SUGGEST); }
  else if (act === "buildskip") finishBuild();
});
let libTimer = null;
document.addEventListener("input", e => { if (e.target.id === "lib-search") { const v = e.target.value; clearTimeout(libTimer); libTimer = setTimeout(() => { S.lib.q = v; render(); const s = $("#lib-search"); if (s) { s.focus(); s.setSelectionRange(v.length, v.length); } }, 150); } });
document.addEventListener("change", e => { if (e.target.id === "lib-sort") { S.lib.sort = e.target.value; render(); } });
document.addEventListener("submit", e => { if (e.target.id === "start-form") { e.preventDefault(); const b = $("#continue-start"); if (b) b.click(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#dialog-host").innerHTML) { closeDialog(); return; }
  if ((e.key !== "ArrowLeft" && e.key !== "ArrowRight") || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if ($("#dialog-host").innerHTML) return;
  const t = e.target; if (t && (t.closest("input,textarea,select,[contenteditable],pre,.tablewrap,.seg"))) return;
  const i = STEP_ROUTES.indexOf(route()); if (i < 0) return; const n = i + (e.key === "ArrowRight" ? 1 : -1);
  if (n >= 0 && n < STEP_ROUTES.length) { e.preventDefault(); go(STEP_ROUTES[n]); }
});

render(false);
})();
</script>

</body></html>
