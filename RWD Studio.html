<title>RWD Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: thin prototype band, slim header, left rail + one working column; bordered surfaces on white, one orange marker for "where you are". */
:root{
  color-scheme: light;
  --bg:#ffffff; --ink:#2b2b2b; --muted:#6b6b6b; --line:#e5e5e5; --control:#767676;
  --accent:#f36633; --accent-ink:#ac350f; --on-accent:#202020; --focus:#135cb0;
  --ok:#176b43; --amber:#826007; --grey:#626d78; --bad:#b3261e; --on-status:#ffffff;
  --band:#f6f6f5; --here:#fdf0ea; --disabled-bg:#f1f1f1;
  --win:#e6f0ea; --win-line:#176b43; --undecided:#fbf3df; --exclude:#f7e4e2; --follow:#eceff2;
  --chart:#56616c; --chart-track:#f0f1f2; --shadow:0 6px 24px rgba(0,0,0,.08);
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  --r:10px; --r-sm:8px; --r-lg:12px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--band);border:1px solid var(--line);border-radius:4px;padding:0 3px;overflow-wrap:anywhere}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600;line-height:1.25}
h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}
p{margin:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:12px}

/* band + header */
.band{background:var(--band);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;padding:6px 16px;text-align:center}
.top{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wordmark{color:var(--accent-ink);font-weight:600;font-size:16px;letter-spacing:-.01em;text-decoration:none}
.prod{display:flex;gap:8px;align-items:baseline;min-width:0;flex-wrap:wrap;color:var(--muted)}
.prod strong{color:var(--ink);font-weight:500}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 90px)}
.rail{border-right:1px solid var(--line);padding:16px 0}
.rail ul{list-style:none;margin:0;padding:0}
.rail a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 20px 9px 22px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.rail a:hover{background:var(--band)}
.rail a[aria-current="page"]{border-left-color:var(--accent);font-weight:600;background:var(--here)}
.rail .count{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
main{padding:24px 32px 64px;min-width:0}
.page{max-width:1180px;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead > div{min-width:0}
.sub{color:var(--muted);margin-top:4px;max-width:70ch}

/* buttons */
.btn{font:inherit;font-weight:500;border-radius:var(--r-sm);padding:7px 14px;border:1px solid var(--control);background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--band)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{background:var(--disabled-bg);border-color:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--focus);text-decoration:underline;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* pills + chips */
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;color:var(--on-status);white-space:nowrap;line-height:1.5}
.pill.ok{background:var(--ok)} .pill.amber{background:var(--amber)} .pill.grey{background:var(--grey)} .pill.bad{background:var(--bad)}
.chip{font:inherit;font-size:13px;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--control)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--here);font-weight:500}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qchip{font-family:var(--mono);font-size:12px}
.warnchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--amber);color:var(--amber);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}

/* cards / surfaces */
.card{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;background:var(--bg);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

/* products */
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.product{display:flex;flex-direction:column;gap:14px}
.product.main{grid-column:1 / -1}
.product header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.product header > div{min-width:0}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.steps li{display:flex;flex-direction:column;gap:6px;min-width:0}
.steps .bar{height:6px;border-radius:3px;background:var(--line)}
.steps .done .bar{background:var(--ok)}
.steps .current .bar{background:var(--accent)}
.steps .name{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.steps .current .name{color:var(--ink);font-weight:600}
.stepnow{display:none;font-size:12px;color:var(--muted)}
.product:not(.main) .steps .name{display:none}
.product:not(.main) .stepnow{display:block}
.next{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.next > span:last-child{min-width:0}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}

.stat{display:flex;flex-direction:column;gap:6px}
.stat .big{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.01em}
.stat p{font-size:13px;color:var(--muted)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--bg);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.defs{min-width:1040px;table-layout:fixed}
.defs col.c-sel{width:44px}.defs col.c-var{width:170px}.defs col.c-st{width:150px}.defs col.c-act{width:250px}
.defs .actions{flex-wrap:nowrap}
[tabindex="-1"]:focus{outline:none}
.defs tbody tr{cursor:pointer}
.defs tbody tr:hover td{background:var(--band)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;overflow-wrap:anywhere}
.vid{font-family:var(--mono);font-weight:500;color:var(--ink);background:none;border:0;padding:0;font-size:13px;cursor:pointer;text-align:left}
.vid:hover{text-decoration:underline}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.reason{font-size:12px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.data{min-width:640px;font-family:var(--mono);font-size:12.5px}
.data td,.data th{white-space:nowrap;padding:8px 12px}
.data td.num{text-align:right}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1 1 220px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--control);border-radius:var(--r-sm);padding:7px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.progress{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meter{width:160px;max-width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok)}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

/* variable */
.vhead{display:flex;flex-direction:column;gap:10px}
.vtitle{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.vtitle h1{font-family:var(--mono);font-weight:500}
.vcols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.spec{font-size:13.5px;overflow-wrap:anywhere}
.steps-plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
pre.typed{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--band);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;white-space:pre}
.tl{width:100%;min-width:0}
.tl svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.sw.fill{background:var(--ink)} .sw.hollow{background:var(--bg)} .sw.ex{border-color:var(--control);border-style:dashed;background:var(--bg)}
.sw.box{border-radius:3px}
.cases{min-width:560px}
.cases td{font-size:13px}
details{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 16px}
summary{cursor:pointer;font-weight:500}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:12px 0 0;font-family:var(--mono);font-size:12.5px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.picker{display:flex;gap:8px;flex-wrap:wrap}

/* questions */
.qlayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:16px;align-items:start}
.qtable{min-width:540px}
.qtable tbody tr{cursor:pointer}
.qtable tbody tr:hover td{background:var(--band)}
.qtable tr[aria-selected="true"] td{background:var(--here)}
.qtable tr[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.qtext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;max-width:52ch}
.panel{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.qfull{font-size:13.5px;overflow-wrap:anywhere}
.suggest{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start}
.opt input{margin-top:4px;accent-color:var(--focus)}
.opt label{min-width:0;overflow-wrap:anywhere}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{padding:0;margin-bottom:6px}

/* results */
.chart{width:100%;min-width:0}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,90px) minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
.hbar .t{background:var(--chart-track);border-radius:3px;height:12px;overflow:hidden}
.hbar .t span{display:block;height:100%;background:var(--chart);border-radius:3px}
.hbar .v{font-family:var(--mono);text-align:right}
.hbar .l{overflow-wrap:anywhere}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

/* release */
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.checklist li:last-child{border-bottom:0}
.checklist li > div{min-width:0}

/* dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(32,32,32,.28);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:var(--r-sm);padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);font-size:13px;z-index:30}
.toast .linkbtn{color:var(--bg)}
.foot{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}

@media (max-width:1100px){
  .qlayout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
  .vcols{grid-template-columns:minmax(0,1fr)}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .top{padding:10px 16px;gap:4px 12px}
  .shell{grid-template-columns:minmax(0,1fr);min-height:0}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:0}
  .rail ul{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
  .rail a{flex-direction:column;justify-content:center;gap:0;padding:8px 2px;border-left:0;border-bottom:3px solid transparent;font-size:12.5px;text-align:center}
  .rail a[aria-current="page"]{border-bottom-color:var(--accent);border-left-color:transparent}
  .rail .count{font-size:11px}
  main{padding:18px 16px 72px}
  .products,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .steps .name{display:none}
  .stepnow{display:block}
  h1{font-size:20px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

    svg += `<rect x="${x1}" y="${bandLabY + 8}" width="${Math.max(2, x2 - x1)}" height="${axisY - bandLabY - 8}" fill="${fillOf[b.kind]}" stroke="${lineOf[b.kind]}" stroke-width="1"${dash} rx="3"/>`;
  });
  bandLab.forEach(o => { svg += `<text${halo} x="${o.x}" y="${bandLabY}" font-size="12" font-weight="500" fill="var(--ink)" text-anchor="${o.anchor}">${esc(o.b.label)}</text>`; });
  // index line
  const x0 = X(0), ilw = t.anchor.length * cw; let ia = "middle", ix = x0;
  if (x0 - ilw / 2 < pl) { ia = "start"; ix = Math.max(pl, x0 - 4); } else if (x0 + ilw / 2 > W - pr) { ia = "end"; ix = W - pr; }
  svg += `<line x1="${x0}" y1="${top + 2}" x2="${x0}" y2="${axisY}" stroke="var(--accent)" stroke-width="2"/>`;
  svg += `<text${halo} x="${ix}" y="${top - 6}" font-size="12" font-weight="600" fill="var(--accent-ink)" text-anchor="${ia}">${esc(t.anchor)}</text>`;
  // axis + ticks
  svg += `<line x1="${pl}" y1="${axisY}" x2="${W - pr}" y2="${axisY}" stroke="var(--control)" stroke-width="1"/>`;
  const span = t.max - t.min, target = Math.max(3, Math.floor((W - pl - pr) / 64));
  const step = [1, 2, 5, 7, 10, 14, 15, 20, 30, 50, 60, 90, 100, 120, 180].find(s => span / s <= target) || 365;
  const ticks = []; for (let d = Math.ceil(t.min / step) * step; d <= t.max; d += step) ticks.push(d);
  if (ticks.indexOf(0) < 0) ticks.push(0);
  t.bands.forEach(b => { [b.from, b.to].forEach(d => { if (ticks.indexOf(d) < 0 && d > t.min && d < t.max) ticks.push(d); }); });
  ticks.sort((a, b) => a - b);
  let lastX = -99;
  const must = new Set([0].concat(...t.bands.map(b => [b.from, b.to])));
  const shown = ticks.filter(d => { return true; });
  // drop colliding labels, keeping band edges and 0
  const keep = [];
  shown.filter(d => must.has(d)).concat(shown.filter(d => !must.has(d))).forEach(d => { const x = X(d); if (keep.every(k => Math.abs(X(k) - x) >= 30)) keep.push(d); });
  ticks.forEach(d => { const x = X(d); svg += `<line x1="${x}" y1="${axisY}" x2="${x}" y2="${axisY + 5}" stroke="var(--control)"/>`; });
  keep.forEach(d => { const x = X(d); const a = x < pl + 12 ? "start" : x > W - pr - 12 ? "end" : "middle"; svg += `<text x="${x}" y="${axisY + 19}" font-size="11.5" fill="var(--muted)" text-anchor="${a}" style="font-family:var(--mono)">${dnum(d)}</text>`; });
  svg += `<text x="${W - pr}" y="${axisY + 37}" font-size="11.5" fill="var(--muted)" text-anchor="end">Days from ${t.anchor === "Index date" ? "index" : "line start"}</text>`;
  // marks
  ms.forEach(o => {
    const cy = rowY[o.row] + 8, k = o.m.k;
    const fill = k === "pick" ? "var(--ink)" : "var(--bg)", stroke = k === "ex" ? "var(--control)" : "var(--ink)", dash = k === "ex" ? ' stroke-dasharray="2.5 2"' : "";
    svg += `<line x1="${o.cx}" y1="${cy + 7}" x2="${o.cx}" y2="${axisY}" stroke="${k === "ex" ? "var(--line)" : "var(--control)"}" stroke-width="1" stroke-dasharray="2 3"/>`;
    svg += `<circle cx="${o.cx}" cy="${cy}" r="6" fill="${fill}" stroke="${stroke}" stroke-width="1.6"${dash}/>`;
    svg += `<text${halo} x="${o.tx}" y="${o.above ? cy - 12 : cy + 4}" font-size="12" fill="${k === "ex" ? "var(--muted)" : "var(--ink)"}" font-weight="${k === "pick" ? 600 : 400}" text-anchor="${o.anchor}">${esc(o.m.t)}</text>`;
  });
  svg += "</svg>";
  host.innerHTML = svg;
}

/* ---------- QUESTIONS ---------- */
function VIEWS_questions(){
  if (!S.curQ && DECISIONS.length) S.curQ = DECISIONS[0].id;
  const answered = DECISIONS.length - openQs();
  return `<div class="pagehead"><div><h1>Questions</h1><p class="sub">Ranked by how many definitions each answer unblocks. Answer the top ones first.</p></div>
    <span class="small muted"><strong class="mono">${answered}</strong> of <span class="mono">${DECISIONS.length}</span> answered</span></div>
  <div class="qlayout">
    <div class="tablewrap"><table class="qtable"><thead><tr><th>Rank</th><th>Question</th><th>Owner</th><th>Unblocks</th></tr></thead><tbody>
      ${DECISIONS.map((d, k) => `<tr data-qrow="${esc(d.id)}" aria-selected="${S.curQ === d.id}">
        <td class="mono">${k + 1}</td>
        <td><div class="row" style="gap:8px"><button class="vid" id="qopen-${esc(d.id)}" data-act="selq" data-q="${esc(d.id)}">${esc(d.id)}</button>${S.answers[d.id] ? '<span class="pill amber">Awaiting approval</span>' : '<span class="pill grey">Open</span>'}</div><div class="qtext">${esc(flat(d.q).replace(/\*\*|`/g, ""))}</div></td>
        <td class="mono small">${esc(d.owner)}</td>
        <td class="small" style="min-width:96px">unblocks <strong class="mono">${d.unblocks}</strong> ${d.unblocks === 1 ? "definition" : "definitions"}</td></tr>`).join("")}
    </tbody></table></div>
    <aside class="card panel" id="answer-panel" aria-labelledby="ap-title">${panelHtml()}</aside>
  </div>`;
}
function panelHtml(){
  const d = QBYID[S.curQ]; if (!d) return `<p class="muted">Pick a question to answer it.</p>`;
  const { ev, sug } = splitEvidence(d.evidence), a = S.answers[d.id], defs = linkedDefs(d.id);
  const choice = S.qChoice[d.id] || (sug ? "suggested" : "other");
  const defChips = defs.slice(0, 18).map(i => `<button class="chip qchip" id="ld-${i}" data-act="openvar" data-i="${i}">${esc(RECORDS[i].variable_id)}</button>`).join("") + (defs.length > 18 ? `<span class="small muted">and ${defs.length - 18} more</span>` : "");
  return `<div class="row" style="justify-content:space-between"><h2 id="ap-title" class="mono">${esc(d.id)}</h2>${a ? '<span class="pill amber">Awaiting approval</span>' : '<span class="pill grey">Open</span>'}</div>
    <p class="qfull">${md(d.q)}</p>
    <div class="stack" style="gap:4px"><span class="label">Evidence</span><p class="small qfull">${md(ev)}</p></div>
    <div class="small muted">Owner <span class="mono">${esc(d.owner)}</span> · unblocks <span class="mono">${d.unblocks}</span> definitions</div>
    ${defs.length ? `<div class="stack" style="gap:6px"><span class="label">Linked definitions</span><div class="row">${defChips}</div></div>` : ""}
    ${a ? `<div class="suggest"><span class="label">Recorded answer</span><p class="qfull">${esc(a.text)}</p><p class="small muted">Answered by ${esc(a.by || "you")} · waiting for named approval</p></div>`
    : `<form id="answer-form" class="stack" style="gap:14px" novalidate>
      <fieldset><legend class="label">Your answer</legend>
        ${sug ? `<div class="opt"><input type="radio" name="ans" id="ans-suggested" value="suggested"${choice === "suggested" ? " checked" : ""}><label for="ans-suggested"><span class="small" style="font-weight:600">Suggested answer (not yet approved)</span><br><span class="small">${md(sug)}</span></label></div>` : ""}
        <div class="opt"><input type="radio" name="ans" id="ans-other" value="other"${choice === "other" ? " checked" : ""}><label for="ans-other" class="small" style="font-weight:600">Something else</label></div>
        <textarea id="ans-text" aria-label="Your own answer" placeholder="Write the answer in plain words"${choice === "other" ? "" : " hidden"}></textarea>
      </fieldset>
      <div class="field"><label class="label" for="ans-by">Answered by</label><input type="text" id="ans-by" placeholder="Your name and role" autocomplete="name"></div>
      <p class="small" id="ans-err" style="color:var(--bad)" hidden></p>
      <div><button type="submit" class="btn primary" id="record-answer">Record answer</button></div>
    </form>`}`;
}

/* ---------- RESULTS ---------- */
function VIEWS_results(){
  const R = RESULTS || {}, eng = R.source === "engine";
  const label = eng ? "Computed by the engine on synthetic fixtures" : "Illustrative synthetic numbers";
  const cols = R.columns || [], rows = (R.rows || []).slice(0, 10), dists = R.distributions || [];
  const isNum = v => typeof v === "number";
  const cell = v => v === null || v === undefined || v === "" ? '<span class="muted">null</span>' : esc(isNum(v) ? (Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100)) : v);
  return `<div class="pagehead"><div><h1>Results</h1><p class="sub">What the dataset looks like once the rules run. Every number here comes from one results object.</p></div>
    <span class="${eng ? "pill ok" : "pill amber"}">${esc(label)}</span></div>
  ${R.note && R.note !== label ? `<p class="note">${esc(R.note)}</p>` : ""}
  ${R.receipt ? `<section class="card stack" aria-labelledby="h-rcpt"><h2 id="h-rcpt">Build receipt</h2><div class="tablewrap"><table class="data"><tbody>${[["Engine version",R.receipt.engine_version],["Code commit",R.receipt.git_commit],["Science digest",R.receipt.science_digest],["Output",R.receipt.rows+" rows × "+R.receipt.columns+" columns"],["Cohorts populated",R.receipt.cohorts],["Data",R.receipt.source_mode+" · "+R.receipt.execution]].map(([k,v]) => `<tr><th scope="row" style="text-align:left">${esc(k)}</th><td class="mono">${esc(v)}</td></tr>`).join("")}</tbody></table></div><p class="small muted">The same commit and science digest identify this exact configuration in any later build.</p></section>` : ""}
  <section class="card stack" aria-labelledby="h-attr"><div class="row" style="justify-content:space-between"><h2 id="h-attr">${esc(R.attrition_title || "Cohort attrition")}</h2></div>
    <div class="chart" id="attrition" role="img" aria-label="${esc((R.attrition || []).map(a => a.step + ": " + a.n).join("; "))}"></div></section>
  <section class="stack" aria-labelledby="h-prev"><div class="row" style="justify-content:space-between"><h2 id="h-prev">Dataset preview</h2><span class="small muted">First ${rows.length} rows · ${cols.length} columns</span></div>
    <div class="tablewrap" tabindex="0" aria-label="Dataset preview"><table class="data"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map((c, k) => `<td class="${isNum(r[k]) ? "num" : ""}">${cell(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
  <section class="grid3" aria-label="Distributions">${dists.map((d, k) => { const bars = d.bars || [], tot = bars.reduce((a, b) => a + (+b.n || 0), 0), mx = Math.max(1, ...bars.map(b => +b.n || 0));
    return `<div class="card stack"><div class="row" style="justify-content:space-between"><h3>${esc(d.title)}</h3><span class="small muted mono">n = ${fmtN(tot)}</span></div>
      <div class="hbars">${bars.map(b => `<div class="hbar"><span class="l">${esc(b.label)}</span><span class="t"><span style="width:${(+b.n || 0) / mx * 100}%"></span></span><span class="v">${fmtN(b.n)}</span></div>`).join("")}</div></div>`; }).join("")}</section>`;
}
function drawAttrition(){
  const host = $("#attrition"); if (!host) return;
  const A = (RESULTS && RESULTS.attrition) || []; if (!A.length) { host.innerHTML = '<p class="muted">No attrition steps.</p>'; return; }
  const W = Math.max(280, Math.floor(host.clientWidth || 600)), first = (RESULTS.attrition_title ? Math.max(...A.map(x => +x.n || 0)) : +A[0].n) || 1, rowH = 46, barH = 16, numW = 120;
  const H = A.length * rowH + 4, bw = W - numW - 2;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="font-family:var(--sans)">`;
  A.forEach((a, k) => {
    const y = k * rowH, w = Math.max(2, (+a.n || 0) / first * bw), pct = Math.round((+a.n || 0) / first * 100);
    const lab = String(a.step), maxc = Math.floor(W / 6.8), txt = lab.length > maxc ? lab.slice(0, maxc - 1) + "…" : lab;
    svg += `<text x="0" y="${y + 14}" font-size="12.5" fill="var(--ink)">${esc(txt)}</text>`;
    svg += `<rect x="0" y="${y + 21}" width="${bw}" height="${barH}" rx="3" fill="var(--chart-track)"/>`;
    svg += `<rect x="0" y="${y + 21}" width="${w}" height="${barH}" rx="3" fill="${!RESULTS.attrition_title && k === A.length - 1 ? "var(--ink)" : "var(--chart)"}"/>`;
    svg += `<text x="${bw + 10}" y="${y + 34}" font-size="12.5" fill="var(--ink)" style="font-family:var(--mono)">${fmtN(a.n)}${RESULTS.attrition_title ? "" : `<tspan fill="var(--muted)"> · ${pct}%</tspan>`}</text>`;
  });
  host.innerHTML = svg + "</svg>";
}

/* ---------- RELEASE ---------- */
function VIEWS_release(){
  const c = counts(), ans = DECISIONS.length - openQs();
  const item = (id, name, detail, st) => `<li id="chk-${id}"><div><div style="font-weight:500">${name}</div><div class="small muted">${detail}</div></div>${st}</li>`;
  const defSt = c.reviewed === c.all ? '<span class="pill ok">Complete</span>' : '<span class="pill amber">In progress</span>';
  const qSt = ans === DECISIONS.length ? '<span class="pill ok">Complete</span>' : ans ? '<span class="pill amber">In progress</span>' : '<span class="pill grey">Not started</span>';
  return `<div class="pagehead"><div><h1>Release</h1><p class="sub">A version goes out once every item below is complete. Approval is recorded with a name.</p></div></div>
  <section class="card" aria-label="Release checklist" style="max-width:720px"><ul class="checklist">
    ${item("defs", "Definitions reviewed", `<span class="mono">${c.reviewed}</span> of <span class="mono">${c.all}</span> reviewed`, defSt)}
    ${item("qs", "Questions answered", `<span class="mono">${ans}</span> of <span class="mono">${DECISIONS.length}</span> answered, approval pending`, qSt)}
    ${item("src", "Sources checked", "Live source check against the delivery", '<span class="pill grey">Not started</span>')}
    ${item("dp", "Python and R agree", "Independent double programming on synthetic fixtures", '<span class="pill ok">Complete</span>')}
    ${item("appr", "Named approval", "Science and data owner sign the version", '<span class="pill grey">Not started</span>')}
  </ul></section>
  <div class="stack" style="gap:6px;max-width:720px"><div><button class="btn primary" id="release-btn" disabled aria-describedby="release-help">Release version ${PRODUCT.spec}.1</button></div>
    <p class="small muted" id="release-help">Available when every item is complete.</p></div>`;
}

const VIEWS = { home: () => VIEWS_home(), definitions: VIEWS_definitions, variable: VIEWS_variable, questions: VIEWS_questions, results: VIEWS_results, release: VIEWS_release };
const AFTER = { variable: drawTimeline, results: drawAttrition };

/* ---------- actions ---------- */
function setStatus(i, st){ S.st[i] = st; S.sel.delete(i); }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) {
    const tr = e.target.closest("tr[data-row]");
    if (tr && !e.target.closest("input,button,a")) { S.cur = +tr.dataset.row; go("variable"); return; }
    const qr = e.target.closest("tr[data-qrow]");
    if (qr && !e.target.closest("input,button,a,textarea")) { S.curQ = qr.dataset.qrow; render(); scrollPanel(); }
    return;
  }
  const act = el.dataset.act, i = el.dataset.i !== undefined ? +el.dataset.i : null;
  if (act === "closedlg") { if (e.target === el) closeDialog(); return; }
  e.preventDefault();
  if (act === "nav") go(el.dataset.to);
  else if (act === "other") { homeNote = el.dataset.p; render(); }
  else if (act === "reset") { seed(); S.curQ = DECISIONS[0] && DECISIONS[0].id; homeNote = ""; render(); toast("Prototype reset to its starting state"); }
  else if (act === "filter") { S.filter = el.dataset.f; S.page = 0; S.sel.clear(); render(); }
  else if (act === "page") { S.page += +el.dataset.d; S.sel.clear(); render(); window.scrollTo(0, 0); }
  else if (act === "openvar") { if (i >= 0) { S.cur = i; if (route() === "variable") { lastRoute = null; render(true); } else go("variable"); } }
  else if (act === "openq") { S.curQ = el.dataset.q; go("questions"); }
  else if (act === "selq") { S.curQ = el.dataset.q; render(); scrollPanel(); }
  else if (act === "accept") { setStatus(i, "accepted"); render(); toast("Accepted " + RECORDS[i].variable_id, String(i)); }
  else if (act === "reject") { setStatus(i, "rejected"); render(); toast("Rejected " + RECORDS[i].variable_id, String(i)); }
  else if (act === "undo") { delete S.st[+el.dataset.i]; $("#toast-host").innerHTML = ""; render(); }
  else if (act === "change") openChange(i);
  else if (act === "savechange") { const k = S.noteFor, t = $("#change-text").value.trim(); if (k !== null) { if (t) S.notes[k] = t; setStatus(k, "changed"); closeDialog(); render(); toast("Change saved for " + RECORDS[k].variable_id); const b = document.getElementById("chg-" + k) || document.getElementById("v-change"); if (b) b.focus(); } }
  else if (act === "bulk") { const n = S.sel.size; S.sel.forEach(k => { S.st[k] = "accepted"; }); S.sel.clear(); render(); toast("Accepted " + n + (n === 1 ? " definition" : " definitions")); }
});
function scrollPanel(){ if (window.matchMedia("(max-width:1100px)").matches) { const p = $("#answer-panel"); if (p) p.scrollIntoView({ block: "start", behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); } }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#dialog-host").innerHTML) closeDialog(); });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.sel !== undefined) { const k = +t.dataset.sel; if (t.checked) S.sel.add(k); else S.sel.delete(k); render(); }
  else if (t.id === "sel-page") { const rows = filtered().slice(S.page * PER, S.page * PER + PER).filter(k => status(k) !== "needs" && status(k) !== "accepted"); rows.forEach(k => { if (t.checked) S.sel.add(k); else S.sel.delete(k); }); render(); }
  else if (t.id === "domain-select") { S.domain = t.value; S.page = 0; S.sel.clear(); render(); }
  else if (t.name === "ans") { S.qChoice[S.curQ] = t.value; const ta = $("#ans-text"); if (ta) { ta.hidden = t.value !== "other"; if (!ta.hidden) ta.focus(); } }
});
let searchTimer = null;
document.addEventListener("input", e => { if (e.target.id === "def-search") { const v = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.q = v; S.page = 0; S.sel.clear(); render(); const s = $("#def-search"); if (s) { s.focus(); s.setSelectionRange(v.length, v.length); } }, 150); } });
document.addEventListener("submit", e => {
  if (e.target.id !== "answer-form") return;
  e.preventDefault();
  const d = QBYID[S.curQ]; if (!d) return;
  const choice = (document.querySelector('input[name="ans"]:checked') || {}).value;
  const { sug } = splitEvidence(d.evidence);
  const text = choice === "suggested" ? sug : ($("#ans-text").value || "").trim();
  const by = ($("#ans-by").value || "").trim(), err = $("#ans-err");
  if (!text) { err.textContent = "Write your answer, or pick the suggested one."; err.hidden = false; $("#ans-text").hidden = false; $("#ans-text").focus(); return; }
  if (!by) { err.textContent = "Add who is answering, so the approval has a name."; err.hidden = false; $("#ans-by").focus(); return; }
  const before = RECORDS.filter((r, k) => status(k) === "needs").length;
  S.answers[d.id] = { text, by, choice };
  const after = RECORDS.filter((r, k) => status(k) === "needs").length, moved = before - after;
  render();
  toast("Answer recorded for " + d.id + " · " + moved + (moved === 1 ? " definition moved" : " definitions moved") + " to review");
  const h = $("#ap-title"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
});

render(false);
})();
</script>

</body></html>
